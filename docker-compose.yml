# Consensus — PostgreSQL test container
# Start: docker compose up -d
#        (host port 5432 already bound? pick another host port and keep the
#         container port at 5432: CONSENSUS_PG_PORT=15433 docker compose up -d)
# Stop:  docker compose down -v
#
# axiom:trace work_item=WI-postgres-full-integration
#   spec=specs/003-database.md
#   plan=phase-1/task-1/step-1
#   ops=docker-compose.yml

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: consensus
      POSTGRES_PASSWORD: consensus
      POSTGRES_DB: consensus
    ports:
      # Host port is configurable so this stack can coexist with a local
      # postgres already bound to 5432 (dev boxes, shared hosts).
      - "${CONSENSUS_PG_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U consensus -d consensus"]
      interval: 2s
      timeout: 5s
      retries: 10
      start_period: 3s

volumes:
  pgdata:
