guards:
  test_mode: diff
  secrets: true
  lint: true
  tests: true
  test_command: go test -short -count=1 ./...
  dead_code: false
  go:
    build: true
    lint: true
    tests: true
pipeline:
  stages:
  - id: tier1
    parallel: true
    true:
    - pre-commit
    - pre-eval
    steps:
    - id: secrets
      type: script
      run: "STAGED=$(git diff --cached --name-only --diff-filter=ACM 2>/dev/null ||\
        \ echo \"\")\n[ -z \"$STAGED\" ] && exit 0\nSECRET_PATTERNS='\\bsk-[a-zA-Z0-9_-]{20,}|ghp_[a-zA-Z0-9]{36}|-----BEGIN\
        \ (RSA |EC |OPENSSH )PRIVATE KEY-----|(OPENROUTER|DEEPSEEK|ZAI|ANTHROPIC|OPENAI)_API_KEY\\\
        s*=\\s*(sk-[a-zA-Z0-9_-]{20,}|[A-Za-z0-9+/=]{32,})'\nPASS=1\nwhile IFS= read\
        \ -r file; do\n  [ ! -f \"$file\" ] && continue\n  git check-ignore -q \"\
        $file\" 2>/dev/null && continue\n  # Skip spec files, docs, and markdown\n\
        \  case \"$file\" in specs/*|docs/*|*.md) continue ;; esac\n  if grep -Pn \"$SECRET_PATTERNS\" \"$file\"\
        \ 2>/dev/null; then\n    echo \"SECRET DETECTED in $file\" >&2\n    PASS=0\n\
        \  fi\ndone <<< \"$STAGED\"\n[ $PASS -eq 0 ] && exit 1\necho \"\u2713 Secrets\
        \ scan: PASS\"\n"
      on_fail: block
    - id: lint
      type: script
      run: go vet ./...
      on_fail: continue
    - id: tests
      type: script
      run: go test -short -count=1 ./...
      on_fail: continue
  - id: tier2
    type: ai_eval
    true:
    - pre-eval
    condition: 'true'
    max_iterations: 50
    tools:
    - read_file
    - run_command
    - search_pattern
    - read_diff
    - sandbox
evaluator:
  max_iterations: 50
  max_time: 10m
  max_input_tokens: 0.2M
  max_output_tokens: 0.05M
  tool_call_weight: 0.1
defaults:
  model: deepseek-v4-flash
  max_iterations: -1
  check_for_updates: true
  update_check_ttl: 24h
history:
  enabled: true
  storage: filesystem
