# GitReins Configuration — Consensus (Go)
# 
# Tier 1: Static guards — secrets, go vet, go test -short
# Tier 2: Agentic evaluator — LLM judges work against task criteria

guards:
  secrets: true
  lint: true
  tests: true
  test_command: "go test -short -count=1 ./..."

pipeline:
  stages:
    # Stage 1: Parallel static checks (pre-commit + pre-eval)
    - id: tier1
      parallel: true
      on: [pre-commit, pre-eval]
      steps:
        - id: secrets
          type: script
          run: |
            STAGED=$(git diff --cached --name-only --diff-filter=ACM 2>/dev/null || echo "")
            [ -z "$STAGED" ] && exit 0
            SECRET_PATTERNS='sk-[a-zA-Z0-9_-]{20,}|ghp_[a-zA-Z0-9]{36}|-----BEGIN (RSA |EC |OPENSSH )PRIVATE KEY-----|(OPENROUTER|DEEPSEEK|ZAI|ANTHROPIC|OPENAI)_API_KEY\s*=\s*(sk-[a-zA-Z0-9_-]{20,}|[A-Za-z0-9+/=]{32,})'
            PASS=1
            while IFS= read -r file; do
              [ ! -f "$file" ] && continue
              git check-ignore -q "$file" 2>/dev/null && continue
              if grep -Pn "$SECRET_PATTERNS" "$file" 2>/dev/null; then
                echo "SECRET DETECTED in $file" >&2
                PASS=0
              fi
            done <<< "$STAGED"
            [ $PASS -eq 0 ] && exit 1
            echo "✓ Secrets scan: PASS"
          on_fail: block

        - id: lint
          type: script
          run: "go vet ./..."
          on_fail: continue

        - id: tests
          type: script
          run: "go test -short -count=1 ./..."
          on_fail: continue

    # Stage 2: AI evaluation (LLM judges work against criteria)
    - id: tier2
      type: ai_eval
      on: [pre-eval]
      condition: "true"
      max_iterations: 16
      tools: [read_file, run_command, search_pattern, read_diff, sandbox]

# v0.3.0+ evaluator caps — all separate, all optional
# -1 = unlimited. Decimal notation supported: "0.2M" = 200k, "0.05M" = 50k
evaluator:
  max_iterations: 50         # LLM turns (-1 = unlimited)
  max_time: "5m"             # wall clock cap
  max_input_tokens: -1       # unlimited — evaluator reads many source files
  max_output_tokens: "0.2M"  # output budget (200k tokens)
  tool_call_weight: 0.1      # tool calls cost 0.1 iterations (default)
