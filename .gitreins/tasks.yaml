tasks:
- id: spec-003-database
  title: 'SPEC-003: Database Schema & Parity Layer'
  criteria:
  - 'Binary compiles: CGO_ENABLED=0 go build ./cmd/consensus exits 0'
  - 'Append-only memory_events: grep for REVOKE UPDATE/DELETE on memory_events in
    .sql/.go files'
