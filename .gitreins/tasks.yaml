- id: server-serve
  title: Server startup and health
  criteria:
  - consensus serve starts and listens on specified port (verify with ss -tlnp)
  - GET /api/v1/health returns 200 with JSON body {"status":"ok"}
  - Server logs startup message with port and database backend
  - SIGTERM triggers graceful shutdown — in-flight requests complete
  - consensus serve --help lists all flags (--port, --hostname, --db-url, --adapter)
  status: complete
  created_at: '2026-06-21T12:03:50.814776+00:00'
  completed_at: '2026-07-25T11:08:27.526188+00:00'
- id: api-sessions
  title: Session API CRUD — correct JSON shapes
  criteria:
  - POST /api/v1/sessions returns 201 with JSON body containing id (UUID), status,
    model fields
  - GET /api/v1/sessions lists sessions — returns JSON array, empty array is valid
  - GET /api/v1/sessions/{id} returns 200 with full session object including status,
    iteration, created_at
  - GET /api/v1/sessions/{nonexistent} returns 404 with {"error":{"code":"NOT_FOUND"}}
  - PATCH /api/v1/sessions/{id} returns updated session JSON — status change is persisted
  - All session endpoints require Authorization header — missing returns 401
  - Invalid session ID (not UUID) returns 400 with error details
  status: complete
  created_at: '2026-06-21T12:03:57.245708+00:00'
  completed_at: '2026-07-25T11:13:39.114742+00:00'
- id: append-only-guard
  title: Append-only enforcement on memory_events
  criteria:
  - UPDATE on memory_events is blocked at database level — returns SQL error, not
    success
  - DELETE on memory_events is blocked at database level — returns SQL error, not
    success
  - INSERT on memory_events succeeds and auto-increments id
  - Attempted UPDATE via harness executor is caught and logged without crashing server
  - Both SQLite and Postgres enforce append-only — triggers exist for SQLite (migration
    017) and Postgres (migration 018)
  status: complete
  created_at: '2026-06-21T12:04:07.968567+00:00'
  completed_at: '2026-07-25T11:12:18.411549+00:00'
- id: error-format
  title: Consistent error handling across API
  criteria:
  - All error responses use {"error":{"code":"...","message":"...","details":"..."}}
    JSON shape
  - 'HTTP status codes are correct: 400 for validation, 401 for auth, 403 for forbidden,
    404 for not found, 500 for internal'
  - Error code strings are ALL_CAPS_SNAKE_CASE (e.g., NOT_FOUND, INVALID_REQUEST,
    UNAUTHENTICATED)
  - No error response leaks stack traces, SQL queries, or internal paths
  - Content-Type is application/json on all responses (success and error)
  status: complete
  created_at: '2026-06-21T12:04:09.332438+00:00'
  completed_at: '2026-07-25T11:03:21.272622+00:00'
- id: harness-loop
  title: Harness execution loop — real agent workflow
  criteria:
  - Creating a session and calling RunAgentIteration produces at least one LLM call
    and memory event
  - Staging buffer accumulates commands per turn before execution — verified in test
    or code
  - 'Session status transitions: created → planning → executing → completed (or error)'
  - 'Max-turns enforcement: session auto-completes after max_turns iterations'
  - Heartbeat loop prevents zombie sessions — sessions stuck in 'planning' are detected
    and recovered
  status: complete
  created_at: '2026-06-21T12:04:18.573102+00:00'
  completed_at: '2026-07-25T11:13:39.114742+00:00'
- id: migrations-safety
  title: Migration system — apply, verify, rollback
  criteria:
  - All migrations apply without errors on SQLite (go test -short -count=1 ./internal/migrate
    exits 0)
  - All non-_sqlite_ migrations apply without errors on Postgres
  - 'Schema after full migration matches expected tables: sessions, memory_events,
    iteration_commits, and 30+ more'
  - Migration version drift is detected — applied version without matching file blocks
    server start
  - Bootstrap creates schema_versions table before applying any migration
  status: complete
  created_at: '2026-06-21T12:04:19.863169+00:00'
  completed_at: '2026-07-25T11:13:39.114742+00:00'
- id: audit-no-leaks
  title: Cross-cutting audit — no secrets or panics
  criteria:
  - No hardcoded API keys in Go source (sk-*, ghp_*, OPENROUTER_API_KEY=) — all keys
    from env/config
  - No panic() calls outside of init() or truly unrecoverable situations — errors
    use Go error returns
  - No fmt.Println for errors — all logging uses structured logger (slog)
  - No PII (email addresses, real names) in log messages or error responses
  - Database queries use parameterized placeholders (, , ?) — no string concatenation
    for SQL
  status: complete
  created_at: '2026-06-21T12:04:27.129443+00:00'
  completed_at: '2026-07-25T11:13:39.114742+00:00'
- id: regression-details
  title: 'Regression: ErrorResponse includes details field'
  criteria:
  - APIError struct has Details string field with json:"details,omitempty" tag
  - writeError() includes Details field when marshaling ErrorResponse
  - Error responses actually contain details field in JSON output — verify with curl
  - SPEC-015 §6 requires error{code, message, details} format — struct matches spec
  status: complete
  created_at: '2026-06-21T12:04:28.623720+00:00'
  completed_at: '2026-07-25T11:13:39.114742+00:00'
- id: chronicle-says-pane
  title: 'Build SAYS pane: finding cards, evidence citations, trust badges, approve/reject'
  criteria:
  - Finding cards render in the SAYS pane with header (number, status badge, timestamp),
    conclusion text (expandable), collapsible sources/reasoning links, confidence
    bar (5 segments with color coding), approval status line, and action buttons
  - 'Finding card states work: DRAFT (default border, Awaiting review), APPROVED (green
    border-left, ✓ badge, success-muted pill), REJECTED (red border-left, opacity
    0.6, dimmed), OUTDATED (dashed border)'
  - 'Approval workflow: clicking Approve shows confirmation, updates card to APPROVED
    state with green sweep animation; Request Revision opens dialog and reverts to
    Draft'
  - 'Bidirectional reasoning links work: clicking a reasoning link in a finding scrolls
    the THINK pane to the linked thought card with pulse animation; clicking View
    Finding on a thought card scrolls the SAYS pane to the finding'
  - 'Filter bar at top of SAYS pane: All, Draft, Approved, Rejected pills that show/hide
    findings by status'
  - 'Demo integration: after streaming completes in sendMessage(), a demo finding
    card appears in the SAYS pane with sources linked to the last thought card step'
  - 'Confidence bar animates on mount: segments fill sequentially left-to-right with
    staggered timing and color coding based on confidence value'
  status: complete
  created_at: '2026-07-09T03:24:38.742172+00:00'
  completed_at: '2026-07-09T03:40:46.782667+00:00'
- id: chronicle-input-area
  title: Build Input Area — message composer, model selector, budget display (§5.6)
  criteria:
  - Textarea auto-grows from 52px to 200px max-height based on content (§5.6.1)
  - Enter submits message, Shift+Enter adds newline, Cmd+Enter forces submit (§5.6.1)
  - Send button is a 32×32 circle arrow overlay on textarea, visible only when textarea
    has content (§5.6.1)
  - Character count shown below textarea left-aligned, fades in when text has content
    (§5.6.1)
  - 'Input toolbar has: Attach (📎), Context (@), Model selector (#), and token counter
    on right (§5.6.2)'
  - Model selector dropdown lists deepseek-v4-pro, deepseek-v4-flash, claude-sonnet-4,
    gpt-4o, local-model with cost/latency (§5.6.2)
  - Token counter shows token estimate and cost, updates on keystroke with 300ms debounce
    (§5.6.2)
  - sendMessage() calls POST /api/v1/sessions/{id}/message endpoint (§5.6.3)
  - Context pills appear between toolbar and textarea when context items selected,
    with × remove button (§5.6.2)
  - Model selection persists per investigation via localStorage (§5.6.2)
  status: complete
  created_at: '2026-07-09T10:12:35.128314+00:00'
  completed_at: '2026-07-09T10:32:36.965367+00:00'

