openapi: "3.0.3"
info:
  title: Consensus — Anthropic Compatibility Shim
  version: "1.0.0"
  description: |
    Anthropic-compatible API shim for Consensus. Tools using the Anthropic
    Messages API can point at Consensus. Requests create Consensus sessions
    with append-only memory and semantic retrieval.
servers:
  - url: http://localhost:8090/v1
    description: Consensus serve (OpenCode shim)

paths:
  /messages:
    post:
      summary: Create a message
      description: |
        Anthropic-compatible Messages endpoint. Creates a Consensus session,
        processes the messages, and returns the LLM response. Full trace
        stored in the append-only ledger.
      operationId: createMessage
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MessageRequest'
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        '401':
          description: Invalid API key (x-api-key header)

components:
  schemas:
    MessageRequest:
      type: object
      required:
        - model
        - max_tokens
        - messages
      properties:
        model:
          type: string
          description: Model ID from model_registry
          example: claude-sonnet-4-20250514
        max_tokens:
          type: integer
          description: Maximum tokens in response
          example: 4096
        messages:
          type: array
          items:
            $ref: '#/components/schemas/ContentBlock'
        system:
          type: string
          description: System prompt (Anthropic-specific)
        temperature:
          type: number
          default: 0.7
        stop_sequences:
          type: array
          items:
            type: string
        stream:
          type: boolean
          default: false
        tools:
          type: array
          items:
            type: object
        metadata:
          type: object
          properties:
            user_id:
              type: string
            session_id:
              type: string
              description: Existing Consensus session ID to continue
        thinking:
          type: object
          properties:
            type:
              type: string
              enum: [enabled]
            budget_tokens:
              type: integer
    ContentBlock:
      type: object
      required:
        - role
        - content
      properties:
        role:
          type: string
          enum: [user, assistant]
        content:
          oneOf:
            - type: string
            - type: array
              items:
                $ref: '#/components/schemas/ContentBlockItem'
    ContentBlockItem:
      type: object
      properties:
        type:
          type: string
          enum: [text, image, tool_use, tool_result]
        text:
          type: string
        source:
          type: object
        id:
          type: string
        name:
          type: string
        input:
          type: object
    MessageResponse:
      type: object
      properties:
        id:
          type: string
        type:
          type: string
          enum: [message]
        role:
          type: string
          enum: [assistant]
        content:
          type: array
          items:
            $ref: '#/components/schemas/ContentBlockItem'
        model:
          type: string
        stop_reason:
          type: string
          enum: [end_turn, max_tokens, stop_sequence, tool_use]
        stop_sequence:
          type: string
        usage:
          type: object
          properties:
            input_tokens:
              type: integer
            output_tokens:
              type: integer
        consensus_session_id:
          type: string
          format: uuid
          description: |
            Consensus-specific: the session ID for retrieving the full
            investigation trace with THINK/SAYS split-pane reasoning.
