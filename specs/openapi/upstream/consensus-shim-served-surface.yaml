so no patch is applied), answers the declared 400 BadRequest envelope for a payload violating the schema and for a present-but-blank directory/workspace selector, answers 405 METHOD_NOT_ALLOWED on non-POST, and left the isStubPath non-GET stub exemption so the served path takes api-key auth like every other implemented route; SHIM-GAP-004 resolved the last error-contract-only operations in the 2026-09-29 SHIM-NARROWED-001..011 set: POST /permission/{requestID}/reply (permission.reply, SHIM-NARROWED-001) now serves its FULL declared contract — the declared body {reply*: once|always|reject, message?} additionalProperties false is validated (400 Body/Payload), an unknown or no-longer-pending id answers the declared 404 typed PermissionNotFoundError, and a pending row is resolved through the REAL approval_requests write path (the sessionPermissionRespond mapping) answering the declared boolean 200 true plus the approval_resolved SSE event — and POST /tui/select-session (tui.selectSession, SHIM-NARROWED-011) now serves its full contract too (400 for a body violating {sessionID*}, 404 NotFoundError for a session this instance does not hold, 200 false for a session that exists because no TUI process is attached, the tui.showToast precedent); question.reply gained the declared 400 arm for its declared requestBody while its declared 200 stays unreachable. The comparison no longer hand-lists this class: it DETECTS an error-contract narrowing from the declared response set and the served outcome and ABORTS unless the served-surface row carries x-shim-error-contract-narrowing: true with a non-empty narrowing-rationale, which surfaced TEN further rows that were scored `covered` while answering only the error half of their contract (the five /pty/{ptyID} operations, mcp.auth.start/authenticate/callback, session.share and session.unshare) plus part.update; all 14 are now recorded with reasons, counts.narrowed_unexplained = 0, and the artifact carries their rationales in narrowed_error_contract_only + appendix-narrowed.md; ROUTE-ADD-021 moved the seven declared v2 read-only list operations from NOT-SERVED to covered — GET /api/location (v2.location.get, SHIM-DRIFT-016), GET /api/model (v2.model.list, SHIM-DRIFT-017), GET /api/reference (v2.reference.list, SHIM-DRIFT-031), GET /api/skill (v2.skill.list, SHIM-DRIFT-057), GET /api/permission/request (v2.permission.request.list, SHIM-DRIFT-018), GET /api/permission/saved (v2.permission.saved.list, SHIM-DRIFT-019) and GET /api/question/request (v2.question.request.list, SHIM-DRIFT-030): each exact path had no shim route at all (net/http default 404) and now answers its declared 200 — /api/location derives the real selected workspace (requestWorkspaceDir + instanceID), /api/skill serves the real skills_registry rows, /api/model READS the real model_registry catalog (an unreadable catalog answers the declared 503 ServiceUnavailableError, service 'model_registry') and answers an empty data array because no registry row holds the ModelV2Info members the pinned schema requires, and /api/reference, /api/permission/request, /api/permission/saved and /api/question/request answer the declared empty collection where no store exists or where a real store's row cannot be truthfully reshaped; all seven keep the declared InvalidRequestError 400 for malformed selectors, the declared UnauthorizedError 401 via the exact-path v2EnvelopeRoutePaths list in server.go, and the sibling METHOD_NOT_ALLOWED 405 for undeclared methods (drift_declared_not_served 87 -> 80); ROUTE-ADD-009 registered GET /api/event (v2.event.subscribe, SHIM-DRIFT-003): the exact path had no shim route at all (net/http default 404) and is now served as an HONEST ERROR-CONTRACT NARROWING (ROUTE-FIX-037 precedent, x-shim-error-contract-narrowing on the row, SHIM-NARROWED-100 in the regenerated artifact) — the declared 200 is an SSE stream of V2Event (^evt_ id, data.info: Message, durable envelope) that the runtime cannot produce truthfully (its re