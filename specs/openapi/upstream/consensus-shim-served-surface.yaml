# Consensus opencode shim — SERVED surface (derived, not declared).
#
# This file is the "served" side of the declared-vs-served comparison required
# by specs/024-shim-support-matrix.md §A.3. It is a DATA file: it records what
# the shim's router actually answers, derived statically from the route table
# and sub-path switches in internal/shim/opencode/server.go.
#
# Declared side: specs/openapi/upstream/openapi-<version>.surface.json (the
# upstream published document). Comparison procedure and result:
# docs/reports/shim-source-002-baseline-diff-2026-09-29.md.
#
# Scope honesty: this is a STATIC derivation from the route table + handler
# switches + auth middleware. It is not a live probe of a running instance;
# the live, mechanical parity check is SHIM-SOURCE-003.
#
# outcome vocabulary:
#   200 / 201         handled and answered
#   400               handled; the operation's DECLARED error arm is the answer
#                     — for malformed input, or for a well-formed request whose
#                     declared success this runtime cannot truthfully produce
#                     (e.g. an MCP OAuth flow it does not implement). Never an
#                     undeclared 5xx, never a fabricated declared success
#                     (ROUTE-ADD-094/095/096)
#   200-sse           handled, text/event-stream
#   200-mcp-delegate  delegated to the real MCP handler when the request looks
#                     like an MCP client (POST + JSON content-type, or
#                     GET + Accept: text/event-stream); otherwise 501
#   307-redirect      net/http ServeMux subtree-root redirect (no trailing slash)
#   401               requires Consensus auth (Bearer/Basic) and none was valid
#   404               NOT_FOUND (shim's own error body, or net/http default for
#                     an unregistered path)
#   404-typed         upstream-shaped typed NamedError body (e.g. ProjectNotFoundError)
#   405               METHOD_NOT_ALLOWED
#   501               NOT_IMPLEMENTED (declared opencode-specific stub)
#   501-typed         NOT_IMPLEMENTED with the typed envelope
#                     {"error":"not_implemented","operation":"<op>","detail":"..."}
#                     (SHIM-GAP-002 — the shim says WHICH declared operation it
#                     does not implement instead of a lying 404 or a bare 501)
#
# auth policy vocabulary: public | api-key | fixed-workspace-exempt (auth is
# skipped only for the exact upstream compatibility route when the request
# carries x-opencode-directory) | stub-skip-non-GET
#
# Extension declaration (SHIM-GAP-005): a served route that upstream v1.18.33
# does not declare at all (PATH-ABSENT) or that declares only other methods
# (METHOD-ABSENT) can be declared by this file as an intentional shim
# extension: `x-shim-extension: true` plus an `extension-rationale` naming why
# the surface exists outside the upstream document. The declared-vs-served
# comparison classifies such routes as accounted divergence
# (shim_extensions / appendix-shim-extensions.md), not drift — the honest
# alternative to editing the pinned upstream surface. Every x-shim-extension
# row MUST carry a rationale; the comparison aborts on one without it.
#
# Intentional narrowing declaration: a declared upstream operation that the
# shim deliberately excludes may set `x-shim-intentional-narrowing: true` only
# with outcome `501-typed` and a non-empty `narrowing-rationale`. The comparator
# records it as accounted contract coverage separate from both full upstream
# coverage and drift; it never treats the typed 501 as the declared success.
#
# Error-contract narrowing declaration (SHIM-GAP-004): an operation the shim
# ANSWERS, but only with an error code — its served outcome is a code the
# upstream document declares while the document also declares a success code
# this runtime can never produce — sets `x-shim-error-contract-narrowing: true`
# plus a non-empty `narrowing-rationale` naming why the declared success is
# unreachable and which declared arms ARE served. The comparator DETECTS this
# class from the declared response set and the served outcome (it is not a hand
# list, so a narrowing can no longer hide inside `covered` merely because the
# error it answers is in the declared set) and ABORTS when a detected narrowing
# carries no rationale. A client that can only ever receive an error from an
# endpoint cannot use the feature, so every such row is either widened to the
# full declared contract or declared here.

