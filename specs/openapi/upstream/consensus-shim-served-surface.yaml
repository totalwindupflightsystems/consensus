# Consensus opencode shim — SERVED surface (derived, not declared).
#
# This file is the "served" side of the declared-vs-served comparison required
# by specs/024-shim-support-matrix.md §A.3. It is a DATA file: it records what
# the shim's router actually answers, derived statically from the route table
# and sub-path switches in internal/shim/opencode/server.go.
#
# Declared side: specs/openapi/upstream/openapi-<version>.surface.json (the
# upstream published document). Comparison procedure and result:
# docs/reports/shim-source-002-baseline-diff-2026-09-29.md.
#
# Scope honesty: this is a STATIC derivation from the route table + handler
# switches + auth middleware. It is not a live probe of a running instance;
# the live, mechanical parity check is SHIM-SOURCE-003.
#
# outcome vocabulary:
#   200 / 201         handled and answered
#   200-sse           handled, text/event-stream
#   200-mcp-delegate  delegated to the real MCP handler when the request looks
#                     like an MCP client (POST + JSON content-type, or
#                     GET + Accept: text/event-stream); otherwise 501
#   307-redirect      net/http ServeMux subtree-root redirect (no trailing slash)
#   401               requires Consensus auth (Bearer/Basic) and none was valid
#   404               NOT_FOUND (shim's own error body, or net/http default for
#                     an unregistered path)
#   404-typed         upstream-shaped typed NamedError body (e.g. ProjectNotFoundError)
#   405               METHOD_NOT_ALLOWED
#   501               NOT_IMPLEMENTED (declared opencode-specific stub)
#   501-typed         NOT_IMPLEMENTED with the typed envelope
#                     {"error":"not_implemented","operation":"<op>","detail":"..."}
#                     (SHIM-GAP-002 — the shim says WHICH declared operation it
#                     does not implement instead of a lying 404 or a bare 501)
#
# auth policy vocabulary: public | api-key | fixed-workspace-exempt (auth is
# skipped only for the exact upstream compatibility route when the request
# carries x-opencode-directory) | stub-skip-non-GET

