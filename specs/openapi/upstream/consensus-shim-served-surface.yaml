# ── Router catch-all semantics ──
# A declared path that matches no explicit route above still reaches a handler
# whenever its prefix is registered (server.go:173-239). These rules encode the
# dispatch that follows: longest prefix wins, `second_segment` is the path
# segment after the prefix. Used by the declared-vs-served comparison so an
# unlisted declared path is classified from the router's real behaviour rather
# than assumed.
prefix_rules:
  - prefix: /session/
    outcome: 404
    stub_second_segments: [shell, share, summarize, init, fork, revert]
    stub_outcome: 501
    evidence: "server.go:868-913 (handleSessionByID switch; 501 stub list at server.go:900). The five P1 declared methods (revert/share/shell/summarize POST, share DELETE — ROUTE-FIX-014..018) are served in the routes above; this rule now covers only the UNDECLARED methods on those sub-paths (GET /session/{id}/revert, GET /session/{id}/share, PUT /session/{id}/shell, ...), which keep the 501 because 405 is not in any of those operations' declared response sets"
  - prefix: /question/
    outcome: 404
    evidence: "server.go:1276-1288"
  - prefix: /find/
    outcome: 404
    stub_second_segments: [symbol]
    stub_outcome: 501
    evidence: "server.go handleFindSub: file → 200, symbol GET → 200 findSymbols (ROUTE-FIX-002, served above), symbol non-GET → typed 501 find.symbols, else 404. This rule now covers only UNDECLARED methods on the symbol sub-path (the declared GET is a served route above)"
  - prefix: /tui/
    outcome: 404
    stub_second_segments: [append-prompt, submit-prompt]
    stub_outcome: 501
    evidence: "server.go:2242-2256; show-toast left the stub list in ROUTE-FIX-029 and execute-command in ROUTE-FIX-023 (both declared, served above)"
  - prefix: /permission/
    outcome: 404
    evidence: "server.go:2137-2162 (sub-path switch: GET {id}, POST {id}/resolve, POST {id}/reply)"
  - prefix: /project/
    outcome: 404-typed
    evidence: "server.go:1197 handleProjectByID (typed ProjectNotFoundError for every sub-path)"
  - prefix: /vcs/
    outcome: 501
    evidence: "server.go isStubPath (non-GET skips auth → the /vcs/ subtree stub answers 501) + handleProjectVCSSStub; GET keeps auth so unauthenticated is 401. ROUTE-FIX-031 carved the exact path /vcs/apply out of both the stub table (vcsDeclaredOps) and the non-GET auth exemption, so it is a served route above rather than reaching this rule"
  - prefix: /instance/
    outcome: 404
    evidence: "server.go:1348-1360 handleInstanceSub (implemented sub-paths, known stubs, else 404)"
  - prefix: /auth/
    outcome: 405
    evidence: "server.go:1092-1097 (only PUT is supported)"
