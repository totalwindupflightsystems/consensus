# ── Router catch-all semantics ──
# A declared path that matches no explicit route above still reaches a handler
# whenever its prefix is registered (server.go:173-239). These rules encode the
# dispatch that follows: longest prefix wins, `second_segment` is the path
# segment after the prefix. Used by the declared-vs-served comparison so an
# unlisted declared path is classified from the router's real behaviour rather
# than assumed.
prefix_rules:
  - prefix: /session/
    outcome: 404
    stub_second_segments: [shell, share, summarize, init, fork, revert]
    stub_outcome: 501
    evidence: "server.go:868-913 (handleSessionByID switch; 501 stub list at server.go:900)"
  - prefix: /question/
    outcome: 404
    evidence: "server.go:1276-1288"
  - prefix: /find/
    outcome: 404
    stub_second_segments: [symbol]
    stub_outcome: 501
    evidence: "server.go:1989-2024 (handleFindSub: file → 200, symbol → 501, else 404)"
  - prefix: /tui/
    outcome: 404
    stub_second_segments: [append-prompt, submit-prompt, execute-command, show-toast]
    stub_outcome: 501
    evidence: "server.go:2242-2256"
  - prefix: /permission/
    outcome: 404
    evidence: "server.go:2137-2162 (sub-path switch: GET {id}, POST {id}/resolve, POST {id}/reply)"
  - prefix: /project/
    outcome: 404-typed
    evidence: "server.go:1197 handleProjectByID (typed ProjectNotFoundError for every sub-path)"
  - prefix: /vcs/
    outcome: 501
    evidence: "server.go:1159 isStubPath (non-GET skips auth → 501) + server.go:237; GET keeps auth so unauthenticated is 401"
  - prefix: /instance/
    outcome: 404
    evidence: "server.go:1348-1360 handleInstanceSub (implemented sub-paths, known stubs, else 404)"
  - prefix: /auth/
    outcome: 405
    evidence: "server.go:1092-1097 (only PUT is supported)"
