  - path: /session/{id}/message/{messageID}/part/{partID}
    method: PATCH
    outcome: 404
    auth: api-key
    evidence: "server.go handleSessionByID sub message/<id>/part/<id> && PATCH → sessionPartUpdate (ROUTE-FIX-037, formerly SHIM-NARROWED-006 in this artifact's positional ids / SHIM-NARROWED-007 in the 2026-09-29 baseline report): declared responses 200 Part 'Successfully updated part', 400 BadRequest | InvalidRequestError, 404 NotFoundError. Served arms: unknown session 404 (typed session not found), blank messageID 400, ill-shaped messageID 400 (declared pattern ^msg), unknown message 404, blank partID 400, ill-shaped partID 400 (declared pattern ^prt), a supplied body that is not a Part object 400 (p1DecodeBody), and the declared 404 for every well-formed partID. The declared 200 Part is NOT served and never fabricated: the runtime keeps no parts table (migrations/ has none) and no part-editing engine — parts are SYNTHESIZED by getMessageByID from memory_events.content as one id-less text part, so no part with a 'prt-...' id exists to update, and memory_events is append-only (SPEC-002 §2.1; triggers 017/018 abort every UPDATE/DELETE). Unlike session.deleteMessage (whose declared 200 is a plain boolean that can report the truthful false) this operation declares an OBJECT the runtime cannot produce truthfully, so the declared 404 NotFoundError IS the answer (the sessionUnshare precedent, ROUTE-FIX-015). part.update declares NO 409, so a mid-turn session is not answered SessionBusyError. NOTE: the sibling DELETE on this same path is recorded below on purpose — it is still error-contract-only (the 404 comes from the message-DELETE case, not from a part.delete route); ROUTE-FIX-036 owns giving it a dedicated handler"
