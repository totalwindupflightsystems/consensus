# Opencode protocol shim surfaces (SPEC-017).
# The shim translates the opencode server protocol into Consensus native API
# calls. It is mounted at the server root alongside the native /api/v1 REST
# API and uses the same API service layer. Auth accepts the Consensus Bearer
# API key or opencode-style Basic auth (username "opencode", admin key as
# password). Exceptions are noted per-operation: /global/health and /doc are
# unauthenticated, and the /project, /vcs, /instance stub surfaces have their
# own auth policy (see descriptions).
# axiom:trace work_item=interfaces-api-cli-01 spec=specs/017-ui-adapter-layer.md,specs/018-openapi-contract.md

# ── Global ──
globalHealth:
  get:
    tags: [Opencode Shim]
    summary: Shim health check
    operationId: shimGlobalHealth
    description: |
      Returns shim health status. No authentication required — the shim
      auth middleware skips this path.
    security: []
    responses:
      "200":
        description: Shim is healthy.
        content:
          application/json:
            schema:
              type: object
              required: [healthy, version]
              properties:
                healthy:
                  type: boolean
                  example: true
                version:
                  type: string
                  example: consensus-0.1.0

globalEvent:
  get:
    tags: [Opencode Shim]
    summary: Global SSE event stream
    operationId: shimGlobalEvent
    description: |
      SSE event stream mapping Consensus memory events to opencode event
      types (session.updated, permission.requested, message.created, ...).
      The most recent ~50 stored events are replayed on connect, then live
      events stream until the client disconnects. Optional ?session_id=
      scopes the stream to one session.
    responses:
      "200":
        description: SSE event stream (text/event-stream).
        content:
          text/event-stream:
            schema:
              type: string
      "401":
        $ref: "../components/responses.yaml#/Unauthorized"

# ── Sessions ──
session:
  get:
    tags: [Opencode Shim]
    summary: List sessions (opencode format)
    operationId: shimListSessions
    description: |
      Lists sessions newest first, max 50. Optional comma-separated
      ?status= filter (e.g. ?status=idle,thinking).
    responses:
      "200":
        description: Array of sessions in opencode format.
        content:
          application/json:
            schema:
              type: array
              items:
                type: object
                additionalProperties: true
      "401":
        $ref: "../components/responses.yaml#/Unauthorized"
      "500":
        $ref: "../components/responses.yaml#/InternalError"

  post:
    tags: [Opencode Shim]
    summary: Create a session
    operationId: shimCreateSession
    description: |
      Creates a Consensus session. Body fields: title (maps to the
      Consensus agent_name, defaults to "opencode-agent"), goal, model.
      The response includes the generated api_key for the session.
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            properties:
              title:
                type: string
              goal:
                type: string
              model:
                type: string
    responses:
      "200":
        description: Created session with api_key.
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
      "400":
        $ref: "../components/responses.yaml#/BadRequest"
      "401":
        $ref: "../components/responses.yaml#/Unauthorized"
      "500":
        $ref: "../components/responses.yaml#/InternalError"

sessionItem:
  get:
    tags: [Opencode Shim]
    summary: Get session details
    operationId: shimGetSession
    description: |
      Returns one session in opencode format. opencode-specific subpaths
      (shell, command, share, summarize, revert) return 501 NOT_IMPLEMENTED;
      unknown subpaths return 404. prompt_async (POST) is served per its
      upstream contract (204/400/404), as are init and fork.
    parameters:
      - $ref: "#/parameters/ShimSessionId"
    responses:
      "200":
        description: Session details.
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
      "401":
        $ref: "../components/responses.yaml#/Unauthorized"
      "404":
        $ref: "../components/responses.yaml#/NotFound"

  patch:
    tags: [Opencode Shim]
    summary: Update a session
    operationId: shimUpdateSession
    description: |
      Updates session properties (title, status, goal). opencode status
      values are mapped: pause/paused → paused, resume/resumed/idle → idle,
      cancel/cancelled → failed.
    parameters:
      - $ref: "#/parameters/ShimSessionId"
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            properties:
              title:
                type: string
              status:
                type: string
              goal:
                type: string
    responses:
      "200":
        description: 'Updated session (or {"status": "updated"}).'
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
      "400":
        $ref: "../components/responses.yaml#/BadRequest"
      "401":
        $ref: "../components/responses.yaml#/Unauthorized"

  delete:
    tags: [Opencode Shim]
    summary: Delete a session
    operationId: shimDeleteSession
    description: |
      Marks the session failed with a completed_at timestamp (soft delete).
      Returns {"status": "deleted"}.
    parameters:
      - $ref: "#/parameters/ShimSessionId"
    responses:
      "200":
        description: Deletion confirmation.
        content:
          application/json:
            schema:
              type: object
              properties:
                status:
                  type: string
                  example: deleted
      "401":
        $ref: "../components/responses.yaml#/Unauthorized"
      "500":
        $ref: "../components/responses.yaml#/InternalError"

sessionAbort:
  post:
    tags: [Opencode Shim]
    summary: Abort a session
    operationId: shimAbortSession
    description: |
      Marks the session failed with a completed_at timestamp.
      Returns {"status": "aborted"}.
    parameters:
      - $ref: "#/parameters/ShimSessionId"
    responses:
      "200":
        description: Abort confirmation.
        content:
          application/json:
            schema:
              type: object
              properties:
                status:
                  type: string
                  example: aborted
      "401":
        $ref: "../components/responses.yaml#/Unauthorized"
      "500":
        $ref: "../components/responses.yaml#/InternalError"

sessionMessage:
  get:
    tags: [Opencode Shim]
    summary: List session messages
    operationId: shimListMessages
    description: |
      Lists the session's messages (memory events) in opencode format.
    parameters:
      - $ref: "#/parameters/ShimSessionId"
    responses:
      "200":
        description: Array of messages.
        content:
          application/json:
            schema:
              type: array
              items:
                type: object
                additionalProperties: true
      "401":
        $ref: "../components/responses.yaml#/Unauthorized"

  post:
    tags: [Opencode Shim]
    summary: Send a message to a session
    operationId: shimSendMessage
    description: |
      Sends a user instruction. Body: {"parts": [{"type": "text", "text":
      "..."}]}. Wakes idle/booting sessions to "thinking" for harness
      pickup. Returns an assistant acknowledgement message.
    parameters:
      - $ref: "#/parameters/ShimSessionId"
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [parts]
            properties:
              parts:
                type: array
                items:
                  type: object
                  properties:
                    type:
                      type: string
                      example: text
                    text:
                      type: string
    responses:
      "200":
        description: Assistant acknowledgement message.
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
      "400":
        $ref: "../components/responses.yaml#/BadRequest"
      "401":
        $ref: "../components/responses.yaml#/Unauthorized"
      "404":
        $ref: "../components/responses.yaml#/NotFound"

sessionMessageItem:
  get:
    tags: [Opencode Shim]
    summary: Get a single message
    operationId: shimGetMessage
    description: |
      Returns one message by ID (opencode "msg-{id}" format).
    parameters:
      - $ref: "#/parameters/ShimSessionId"
      - $ref: "#/parameters/ShimMessageId"
    responses:
      "200":
        description: Message with info and parts.
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
      "401":
        $ref: "../components/responses.yaml#/Unauthorized"
      "404":
        $ref: "../components/responses.yaml#/NotFound"

sessionChildren:
  get:
    tags: [Opencode Shim]
    summary: List child sessions
    operationId: shimListSessionChildren
    description: |
      Lists sessions whose parent_id is the given session, newest first,
      max 50.
    parameters:
      - $ref: "#/parameters/ShimSessionId"
    responses:
      "200":
        description: Array of child sessions.
        content:
          application/json:
            schema:
              type: array
              items:
                type: object
                additionalProperties: true
      "401":
        $ref: "../components/responses.yaml#/Unauthorized"

# ── Doc (shim OpenAPI document, no auth) ──
doc:
  get:
    tags: [Opencode Shim]
    summary: opencode shim OpenAPI document
    operationId: shimDoc
    description: |
      Serves the machine-readable OpenAPI document for the opencode-compatible
      surface. JSON is returned by default; Accept: application/yaml returns
      YAML. No authentication is required. The native REST API explorer lives
      at /doc/api instead.
    security: []
    responses:
      "200":
        description: Swagger UI HTML page.
        content:
          text/html:
            schema:
              type: string

# ── Config / Provider / Agent ──
config:
  get:
    tags: [Opencode Shim]
    summary: Read shim configuration
    operationId: shimGetConfig
    description: |
      Returns all system_settings under `settings` and an upstream-compatible
      `provider_default` map from provider IDs to their configured default
      model. The Consensus provider entry is derived from
      `settings["llm.default_model"]` when configured; otherwise the map is
      empty.
    responses:
      "200":
        description: Configuration map.
        content:
          application/json:
            schema:
              type: object
              required: [settings, provider_default]
              properties:
                settings:
                  type: object
                  additionalProperties:
                    type: string
                provider_default:
                  type: object
                  description: Default model ID keyed by provider ID.
                  additionalProperties:
                    type: string
                  example:
                    consensus: gpt-4o
      "401":
        $ref: "../components/responses.yaml#/Unauthorized"
      "500":
        $ref: "../components/responses.yaml#/InternalError"

  patch:
    tags: [Opencode Shim]
    summary: Update shim configuration
    operationId: shimUpdateConfig
    description: |
      Upserts system_settings from the JSON body. Returns
      {"status": "updated", "keys": N}.
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            additionalProperties:
              type: string
    responses:
      "200":
        description: Update confirmation.
        content:
          application/json:
            schema:
              type: object
              properties:
                status:
                  type: string
                  example: updated
                keys:
                  type: integer
      "400":
        $ref: "../components/responses.yaml#/BadRequest"
      "401":
        $ref: "../components/responses.yaml#/Unauthorized"

configProviders:
  get:
    tags: [Opencode Shim]
    summary: List model providers
    operationId: shimListConfigProviders
    description: |
      Lists the model_registry as {"providers": [...]} with id, tier,
      max_context, cost_per_m_in, cost_per_m_out, enabled.
    responses:
      "200":
        description: Provider list.
        content:
          application/json:
            schema:
              type: object
              properties:
                providers:
                  type: array
                  items:
                    type: object
                    additionalProperties: true
      "401":
        $ref: "../components/responses.yaml#/Unauthorized"
      "500":
        $ref: "../components/responses.yaml#/InternalError"

provider:
  get:
    tags: [Opencode Shim]
    summary: Get default provider info
    operationId: shimGetProvider
    description: |
      Returns the default LLM provider: {"provider": "consensus",
      "version", "model", "maxTokens"}.
    responses:
      "200":
        description: Provider info.
        content:
          application/json:
            schema:
              type: object
              properties:
                provider:
                  type: string
                  example: consensus
                version:
                  type: string
                model:
                  type: string
                maxTokens:
                  type: integer
      "401":
        $ref: "../components/responses.yaml#/Unauthorized"

agent:
  get:
    tags: [Opencode Shim]
    summary: List available agent types
    operationId: shimListAgents
    description: |
      Returns the available agent types (default, researcher, coder,
      analyst) as an array of {name, description}.
    responses:
      "200":
        description: Agent type list.
        content:
          application/json:
            schema:
              type: array
              items:
                type: object
                properties:
                  name:
                    type: string
                  description:
                    type: string
      "401":
        $ref: "../components/responses.yaml#/Unauthorized"

# ── Tools ──
experimentalTool:
  get:
    tags: [Opencode Shim]
    summary: List tools
    operationId: shimListTools
    description: |
      Lists tools_registry entries (id, name, description, hemisphere,
      handler_type, status, enabled, requires_approval).
    responses:
      "200":
        description: Tool list.
        content:
          application/json:
            schema:
              type: array
              items:
                type: object
                additionalProperties: true
      "401":
        $ref: "../components/responses.yaml#/Unauthorized"
      "500":
        $ref: "../components/responses.yaml#/InternalError"

experimentalToolIDs:
  get:
    tags: [Opencode Shim]
    summary: List tool IDs
    operationId: shimListToolIDs
    description: |
      Returns the tool names from tools_registry as a plain string array.
    responses:
      "200":
        description: Tool name list.
        content:
          application/json:
            schema:
              type: array
              items:
                type: string
      "401":
        $ref: "../components/responses.yaml#/Unauthorized"
      "500":
        $ref: "../components/responses.yaml#/InternalError"

# ── File endpoints ──
find:
  get:
    tags: [Opencode Shim]
    summary: Find files by glob pattern
    operationId: shimFindFiles
    description: |
      Glob-based file search. Requires ?pattern=. Returns
      {"files": [...], "count": N, "pattern": "..."}.
    parameters:
      - name: pattern
        in: query
        required: true
        schema:
          type: string
        description: Glob pattern (e.g. "**/*.go").
    responses:
      "200":
        description: Matching files.
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
      "400":
        $ref: "../components/responses.yaml#/BadRequest"
      "401":
        $ref: "../components/responses.yaml#/Unauthorized"
      "500":
        $ref: "../components/responses.yaml#/InternalError"

findFile:
  get:
    tags: [Opencode Shim]
    summary: Find files by query
    operationId: shimFindFilesSub
    description: |
      File search under /find/file. Requires ?query=. Returns
      {"files": [...], "count": N, "query": "..."}.
    parameters:
      - name: query
        in: query
        required: true
        schema:
          type: string
        description: Search query (glob pattern).
    responses:
      "200":
        description: Matching files.
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
      "400":
        $ref: "../components/responses.yaml#/BadRequest"
      "401":
        $ref: "../components/responses.yaml#/Unauthorized"
      "500":
        $ref: "../components/responses.yaml#/InternalError"

findSymbol:
  # ROUTE-FIX-002: GET /find/symbol is a REAL served operation — findSymbols
  # (find_symbol_routes.go) validates the required ?query= plus the optional
  # directory/workspace selectors and answers the declared 200 Symbol[] (the
  # truthful EMPTY list: the shim has no LSP producer, so entries would be
  # fabricated) or the 400 INVALID_REQUEST arm. Non-GET methods keep the
  # typed 501 (405 is not in the declared set, session.diff ROUTE-FIX-010
  # convention). x-not-implemented was WRONG here — it told generators to
  # expect any answer while the handler has served the declared contract
  # since ROUTE-FIX-002.
  get:
    tags: [Opencode Shim]
    summary: Find symbols
    operationId: shimFindSymbolStub
    description: |
      Searches workspace symbols (functions, classes, variables) named by
      the required ?query= parameter. The optional directory/workspace
      selectors are validated (a present-but-blank value is a 400) but do
      not narrow the result: the shim has no LSP integration, so there is
      no symbol producer and the truthful 200 body is the EMPTY list — an
      array, never null. Missing or blank ?query= answers the 400 arm with
      the INVALID_REQUEST envelope.
    parameters:
      - name: query
        in: query
        required: true
        schema:
          type: string
        description: Symbol name search text (functions, classes, variables).
      - name: directory
        in: query
        required: false
        schema:
          type: string
        description: Optional search scope; must not be blank when provided.
      - name: workspace
        in: query
        required: false
        schema:
          type: string
        description: Optional search scope; must not be blank when provided.
    responses:
      "200":
        description: Matching symbols — the EMPTY list (no LSP producer; never fabricated).
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: "../components/schemas.yaml#/ShimSymbol"
      "400":
        $ref: "../components/responses.yaml#/BadRequest"
      "401":
        $ref: "../components/responses.yaml#/Unauthorized"

fileContent:
  get:
    tags: [Opencode Shim]
    summary: Read file content
    operationId: shimReadFile
    description: |
      Reads a file via the service layer. Requires ?path=. Returns
      {"path": "...", "content": "...", "size": N}.
    parameters:
      - name: path
        in: query
        required: true
        schema:
          type: string
        description: Absolute or relative file path.
    responses:
      "200":
        description: File content.
        content:
          application/json:
            schema:
              type: object
              properties:
                path:
                  type: string
                content:
                  type: string
                size:
                  type: integer
      "400":
        $ref: "../components/responses.yaml#/BadRequest"
      "401":
        $ref: "../components/responses.yaml#/Unauthorized"
      "500":
        $ref: "../components/responses.yaml#/InternalError"

fileStatus:
  get:
    tags: [Opencode Shim]
    summary: Git status
    operationId: shimFileStatus
    description: |
      Returns the working tree git status (delegated to the service layer).
    responses:
      "200":
        description: Git status object.
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
      "401":
        $ref: "../components/responses.yaml#/Unauthorized"
      "500":
        $ref: "../components/responses.yaml#/InternalError"

# ── Permissions (HITL) ──
permissions:
  get:
    tags: [Opencode Shim]
    summary: List pending permissions
    operationId: shimListPermissions
    description: |
      Lists pending approval_requests as opencode permission events.
      Optional ?session_id= filter. Returns {"permissions": [...]},
      max 20, ordered by risk level.
    parameters:
      - name: session_id
        in: query
        schema:
          type: string
        description: Filter by session ID.
    responses:
      "200":
        description: Pending permissions.
        content:
          application/json:
            schema:
              type: object
              properties:
                permissions:
                  type: array
                  items:
                    type: object
                    additionalProperties: true
      "401":
        $ref: "../components/responses.yaml#/Unauthorized"
      "500":
        $ref: "../components/responses.yaml#/InternalError"

permissionItem:
  get:
    tags: [Opencode Shim]
    summary: Get permission details
    operationId: shimGetPermission
    description: |
      Returns one pending approval request with its decision metadata.
    parameters:
      - $ref: "#/parameters/ShimPermissionId"
    responses:
      "200":
        description: Permission details.
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
      "401":
        $ref: "../components/responses.yaml#/Unauthorized"
      "404":
        $ref: "../components/responses.yaml#/NotFound"

permissionResolve:
  post:
    tags: [Opencode Shim]
    summary: Resolve a permission
    operationId: shimResolvePermission
    description: |
      Resolves a pending approval request. Body: {"decision":
      "approved"|"rejected"|"modified", "reason": "..."}. Emits a
      permission.resolved SSE event on success. Returns
      {"id", "status", "resolved": true, "timestamp"}.
    parameters:
      - $ref: "#/parameters/ShimPermissionId"
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [decision]
            properties:
              decision:
                type: string
                enum: [approved, rejected, modified]
              reason:
                type: string
    responses:
      "200":
        description: Resolution confirmation.
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
      "400":
        $ref: "../components/responses.yaml#/BadRequest"
      "401":
        $ref: "../components/responses.yaml#/Unauthorized"
      "404":
        $ref: "../components/responses.yaml#/NotFound"

# ── TUI / LSP / MCP ──
tuiAction:
  # MUSTER-INT-001 (live-probed against a scratch instance 2026-10-09):
  # GET /tui/{action} answers 404 NOT_FOUND for unknown actions and 405
  # METHOD_NOT_ALLOWED for POST-only actions named without a body (clear-prompt,
  # show-toast, append-prompt — each serves its own POST contract); it never
  # answers 501. POST /tui/{action} is REAL for the actions the shim serves:
  # clear-prompt, append-prompt, control/response, open-help, open-models,
  # open-sessions, open-themes, publish, show-toast all validate their body and
  # answer the declared boolean 200 (the shim has no TUI process, so the
  # truthful boolean is false); submit-prompt and execute-command keep the
  # 501 NOT_IMPLEMENTED answer (shim-only, use opencode's built-in TUI). The
  # declared 400 arm carries the opencode NamedError BadRequest envelope
  # (writeOpencodeBadRequest: {name: BadRequest, data: {kind, message}}).
  get:
    tags: [Opencode Shim]
    summary: TUI action status
    operationId: shimTUIControlStub
    description: |
      TUI action lookup. POST-only actions named without a body answer 405
      METHOD_NOT_ALLOWED naming the POST contract; unknown actions answer
      404 NOT_FOUND ("unknown TUI action").
    parameters:
      - name: action
        in: path
        required: true
        schema:
          type: string
          enum: [append-prompt, submit-prompt, execute-command, show-toast]
        description: TUI action name.
    responses:
      "404":
        $ref: "../components/responses.yaml#/NotFound"
      "405":
        $ref: "../components/responses.yaml#/MethodNotAllowed"
      "401":
        $ref: "../components/responses.yaml#/Unauthorized"
  post:
    tags: [Opencode Shim]
    summary: Execute a TUI action
    operationId: shimTUIAction
    description: |
      Executes a TUI action against the shim's (absent) TUI process. Valid
      requests answer the declared boolean 200 — false, truthfully: no TUI
      process is attached, so nothing was displayed. Malformed bodies
      answer 400 with the opencode NamedError BadRequest envelope.
      submit-prompt and execute-command are not implemented in this shim
      and keep the 501 NOT_IMPLEMENTED answer (use opencode's built-in
      TUI).
    parameters:
      - name: action
        in: path
        required: true
        schema:
          type: string
          enum: [append-prompt, clear-prompt, control/response, open-help,
                 open-models, open-sessions, open-themes, publish, show-toast,
                 submit-prompt, execute-command]
        description: TUI action to execute.
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            additionalProperties: true
          examples:
            append-prompt:
              value:
                text: "hello"
            show-toast:
              value:
                message: "build finished"
                variant: info
    responses:
      "200":
        description: "Action accepted — boolean result (false: no TUI process attached)."
        content:
          application/json:
            schema:
              type: boolean
      "400":
        $ref: "../components/responses.yaml#/OpencodeBadRequest"
      "401":
        $ref: "../components/responses.yaml#/Unauthorized"
      "501":
        $ref: "../components/responses.yaml#/NotImplemented"

lsp:
  get:
    tags: [Opencode Shim]
    summary: LSP status
    operationId: shimLSPStatus
    description: |
      Returns LSP integration status — not yet available:
      {"enabled": false, "status": "unavailable", "message": "..."}.
    responses:
      "200":
        description: LSP status.
        content:
          application/json:
            schema:
              type: object
              properties:
                enabled:
                  type: boolean
                  example: false
                status:
                  type: string
                message:
                  type: string
      "401":
        $ref: "../components/responses.yaml#/Unauthorized"

mcp:
  # MCP-DIRECT-001: /mcp is the DISCOVERABLE MCP surface. GET serves the
  # streamable-HTTP SSE stream (server-initiated messages); POST serves the
  # streamable-HTTP JSON-RPC endpoint (initialize, tools/list, tools/call, …)
  # with sessions addressed via the Mcp-Session-Id response header. Both
  # methods are served by the same MCP handler as /mcp/sse and /mcp/message
  # (internal/mcp). Auth: POST answers HTTP 401 with a JSON-RPC error body
  # when the session is unauthenticated/unknown (tools/list and every
  # non-handshake method require an authenticated initialize, DOGFOOD-101);
  # GET issues a session id without auth — authentication happens inside the
  # initialize handshake itself.
  get:
    tags: [MCP]
    summary: MCP streamable-HTTP SSE stream
    operationId: mcpStreamableGet
    description: |
      Opens the MCP server-initiated message stream (text/event-stream),
      same handler as GET /mcp/sse. Part of the streamable-HTTP transport:
      clients POST JSON-RPC requests to POST /mcp and read server-initiated
      messages here.
    responses:
      "200":
        description: SSE stream of server-initiated MCP messages.
        content:
          text/event-stream:
            schema:
              type: string
  post:
    tags: [MCP]
    summary: MCP streamable-HTTP JSON-RPC endpoint
    operationId: mcpStreamablePost
    description: |
      Accepts a single JSON-RPC 2.0 MCP request and answers the JSON-RPC
      response (application/json). Initialize returns the session id in the
      Mcp-Session-Id response header; follow-up calls carry it. Every method
      except initialize / notifications/initialized / ping requires a session
      that completed authenticated initialize — unauthenticated calls answer
      HTTP 401 with a JSON-RPC error object (code -32002 Forbidden).
      Legacy transports remain available: GET /mcp/sse + POST
      /mcp/message?sessionId=...
    responses:
      "200":
        description: JSON-RPC response (success or error payload).
        content:
          application/json:
            schema:
              $ref: "../components/schemas.yaml#/MCPJSONRPCResponse"
        headers:
          Mcp-Session-Id:
            description: Session id for follow-up MCP calls (set by initialize).
            schema:
              type: string
      "202":
        description: >
          Accepted — the request was a notification (no response body). The
          answer is intentionally empty (zero bytes), not a JSON document.
      "400":
        description: Malformed request (parse error or invalid JSON-RPC envelope).
        content:
          application/json:
            schema:
              $ref: "../components/schemas.yaml#/MCPJSONRPCResponse"
      "401":
        description: >
          Unauthenticated MCP session (unknown/expired Mcp-Session-Id, or a
          method called before an authenticated initialize). The body is a
          JSON-RPC error object (code -32002 Forbidden), matching the auth
          semantics documented in docs/INTEGRATION.md.
        content:
          application/json:
            schema:
              $ref: "../components/schemas.yaml#/MCPJSONRPCResponse"
      "405":
        description: Method not allowed (only GET and POST are served). Answered by
          chi's default 405 writer with a bare "method not allowed" text body.
        content:
          text/plain:
            schema:
              type: string
      "501":
        description: >
          MCP traffic is not served on this mount — bare deployments without
          the API-level MCP mount answer 501 NOT_IMPLEMENTED with the shim
          stub's NOT_IMPLEMENTED error envelope. Mount consensus serve to
          reach the real surface.
        content:
          application/json:
            schema:
              $ref: "../components/responses.yaml#/NotImplemented/content/application~1json/schema"

# MCPJSONRPCResponse: loose shape of a JSON-RPC 2.0 response as served by the
# MCP HTTP endpoints. Result and error are intentionally open (MCP results
# vary per method).
mcpJSONRPCResponse:
  type: object
  properties:
    jsonrpc:
      type: string
      enum: ["2.0"]
    id:
      description: Echo of the request id (null for parse errors).
    result:
      description: Method result object (present on success).
    error:
      type: object
      description: JSON-RPC error object (present on failure).
      properties:
        code:
          type: integer
          description: JSON-RPC error code (-32002 = unauthenticated session).
        message:
          type: string
        data:
          description: Optional error detail.

# ── Auth management ──
authItem:
  put:
    tags: [Opencode Shim]
    summary: Update provider/session auth config
    operationId: shimUpdateAuth
    description: |
      Upserts auth configuration for a provider or session. Each body key
      is stored as system_settings "auth.<authId>.<key>". Only PUT is
      supported.
    parameters:
      - name: authId
        in: path
        required: true
        schema:
          type: string
        description: Provider or session identifier.
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            additionalProperties:
              type: string
    responses:
      "200":
        description: Auth config stored.
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
      "400":
        $ref: "../components/responses.yaml#/BadRequest"
      "401":
        $ref: "../components/responses.yaml#/Unauthorized"
      "405":
        description: Method not allowed — only PUT is supported.
        content:
          application/json:
            schema:
              $ref: "../components/responses.yaml#/MethodNotAllowed/content/application~1json/schema"

# ── Event (standalone alias of /global/event) ──
event:
  get:
    tags: [Opencode Shim]
    summary: Standalone SSE event stream
    operationId: shimEventStream
    description: |
      Standalone alias of /global/event — SSE event stream mapping
      Consensus memory events to opencode event types.
    responses:
      "200":
        description: SSE event stream (text/event-stream).
        content:
          text/event-stream:
            schema:
              type: string
      "401":
        $ref: "../components/responses.yaml#/Unauthorized"

# ── Project / VCS (501 stubs, SPEC-017 §3.9) ──
# These are opencode-specific surfaces the Consensus shim does not
# implement. The auth middleware deliberately lets unauthenticated
# requests reach the stub (returning 501, not 401) where the opencode
# contract expects it: /project and /vcs require auth on GET (401
# unauthenticated) while non-GET methods reach the stub.
# DF-CONSENSUS-38: bare GET /vcs and GET /vcs/diff are no longer stubs —
# they are fixed-workspace compatibility routes (see vcs/vcsDiff below);
# only the remaining /vcs/* sub-paths keep the 501 stub contract.
project:
  # ROUTE-FIX-004: declared project.list served for real from the runtime's
  # projects table (migrations 014/015). GET requires auth (401
  # unauthenticated); the declared error vocabulary is 400 only, so a store
  # read failure answers 400 INVALID_REQUEST, and a store without the table
  # (pre-014 database) answers the declared empty array. Non-GET methods on
  # this mount keep the 501 stub (SPEC-017 §3.9).
  get:
    tags: [Opencode Shim]
    summary: List all projects
    operationId: shimProjectList
    description: |
      Serves the upstream project.list operation: an array of Project
      objects translated from the runtime's `projects` table — id and name
      from the row, worktree from the server's configured workdir (the
      single-workspace translation /vcs and /session/{id}/diff use),
      time {created, updated} from created_at (Unix seconds; numeric TEXT
      cells are parsed), sandboxes [] (the runtime provisions none). The
      optional ?directory=/?workspace= selectors are accepted but do not
      narrow (one workspace, no per-project path columns). A store whose
      projects table is absent answers [].
    responses:
      "200":
        description: List of projects.
        content:
          application/json:
            schema:
              type: array
              items:
                type: object
                required: [id, worktree, time, sandboxes]
                properties:
                  id:
                    type: string
                  worktree:
                    type: string
                  name:
                    type: string
                  time:
                    type: object
                    required: [created, updated]
                    properties:
                      created:
                        type: integer
                        minimum: 0
                      updated:
                        type: integer
                        minimum: 0
                  sandboxes:
                    type: array
                    items:
                      type: string
      "400":
        description: Store read failure (the declared error vocabulary for this operation).
        content:
          application/json:
            schema:
              type: object
              required: [error]
              properties:
                error:
                  type: object
                  required: [code, message]
                  properties:
                    code:
                      type: string
                      enum: [INVALID_REQUEST]
                    message:
                      type: string
      "401":
        $ref: "../components/responses.yaml#/Unauthorized"
    x-undeclared-methods: 501 stub (SPEC-017 §3.9; 405 is not in the declared response set)

projectItem:
  # ROUTE-FIX-043 + MUSTER-INT-001 (live-probed 2026-10-09): GET
  # /project/{projectID} answers 200 with the upstream Project object when the
  # id resolves to the singleton workspace's project (only "current" resolves
  # today — projectCurrent), 404 with the typed ProjectNotFoundError NamedError
  # body for every other id, and 401 unauthenticated. PATCH answers the same
  # typed 404 (DF-CONSENSUS-47; httpapi-instance.test.ts "returns typed not
  # found bodies for missing projects").
  get:
    tags: [Opencode Shim]
    summary: Project item
    operationId: shimProjectItem
    description: |
      Resolves a project id. The id of the singleton fixed workspace (the
      value "current", or its instance id) answers 200 with the upstream
      Project object {id, name, sandboxes, time, worktree}. Every other id
      is unknown — the Consensus shim keeps no project registry — and
      answers HTTP 404 with the upstream typed ProjectNotFoundError
      NamedError body, exactly {_tag, projectID, message} (DF-CONSENSUS-47;
      httpapi-instance.test.ts "returns typed not found bodies for missing
      projects").
    parameters:
      - name: projectId
        in: path
        required: true
        schema:
          type: string
        description: Project identifier, or "current" for the singleton workspace.
    responses:
      "200":
        description: The singleton workspace's project (id resolves; today only "current" does).
        content:
          application/json:
            schema:
              $ref: "../components/schemas.yaml#/ShimProject"
      "404":
        description: Typed ProjectNotFoundError body (no project registry — unknown id).
        content:
          application/json:
            schema:
              type: object
              required: [_tag, projectID, message]
              properties:
                _tag:
                  type: string
                  enum: [ProjectNotFoundError]
                projectID:
                  type: string
                message:
                  type: string
      "401":
        $ref: "../components/responses.yaml#/Unauthorized"

vcs:
  # DF-CONSENSUS-38: real fixed-workspace compatibility route (upstream
  # httpapi-instance.test.ts "serves path and VCS read endpoints"). A request
  # carrying a non-empty x-opencode-directory header is exempted from auth
  # and translated exactly like /instance/vcs; headerless GET still requires
  # auth. Non-GET methods and /vcs/* sub-paths keep the 501 stub contract
  # (SPEC-017 §3.9).
  get:
    tags: [Opencode Shim]
    summary: Get VCS info (fixed-workspace compatibility)
    operationId: shimVCS
    description: |
      opencode Vcs.Info translation for the workspace identified by the
      x-opencode-directory header: current branch and default branch, read
      live. Non-git workspaces return {} — never an error. Requests without
      the header require Consensus authentication (401).
    responses:
      "200":
        description: VCS info (both fields optional; {} for non-git workspaces).
        content:
          application/json:
            schema:
              $ref: "../components/schemas.yaml#/VcsInfo"
      "401":
        $ref: "../components/responses.yaml#/Unauthorized"

vcsDiff:
  # DF-CONSENSUS-38: real fixed-workspace compatibility route (upstream
  # httpapi-instance.test.ts "serves path and VCS read endpoints"). A request
  # carrying a non-empty x-opencode-directory header is exempted from auth
  # and translated exactly like /instance/vcs/diff; headerless GET still
  # requires auth. Other /vcs/* sub-paths keep the 501 stub contract.
  get:
    tags: [Opencode Shim]
    summary: Get VCS diff (fixed-workspace compatibility)
    operationId: shimVCSDiff
    description: |
      opencode Vcs.FileDiff translation for the workspace identified by the
      x-opencode-directory header: per-file additions, deletions and status
      for the working tree. Untracked files are counted the upstream way
      (git diff --no-index --numstat — whole lines, including a final line
      without a trailing newline; binary files count 0). Clean or non-git
      workspaces return []. Requests without the header require Consensus
      authentication (401).
    parameters:
      - name: mode
        in: query
        required: false
        schema:
          type: string
          enum: [git, branch]
        description: Diff mode; accepted for upstream compatibility.
    responses:
      "200":
        description: Per-file diff stats (possibly empty array).
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: "../components/schemas.yaml#/VcsFileDiff"
      "401":
        $ref: "../components/responses.yaml#/Unauthorized"

vcsItem:
  # MUSTER-INT-001 (live-probed 2026-10-09): GET /vcs/{id} requires auth —
  # an unauthenticated call answers 401 before any stub handling (probe:
  # "GET /vcs/apply [noauth] -> 401"), so the no-auth claim in the old
  # description was wrong. The marker stays HONEST here: this path IS the
  # declared not-implemented surface (declared /vcs/* operations answer 501),
  # and unlike the pre-fix state the 501 bodies now carry schemas so
  # spec-driven clients can decode both shapes. Real reads live at GET /vcs
  # and GET /vcs/diff (both declared with 200s on their own path items).
  x-not-implemented: true
  get:
    tags: [Opencode Shim]
    summary: VCS item (stub)
    operationId: shimVCSItemStub
    description: |
      VCS sub-operations are opencode-specific. Declared operations the
      shim does not translate (vcs.apply, vcs.diff.raw) answer the typed
      not_implemented envelope naming the operation; any other id answers
      the standard NOT_IMPLEMENTED error envelope. Real reads live at
      GET /vcs (Vcs.Info) and GET /vcs/diff (FileDiff[]).
    parameters:
      - name: vcsId
        in: path
        required: true
        schema:
          type: string
        description: VCS operation name or unknown sub-path id.
    responses:
      "401":
        $ref: "../components/responses.yaml#/Unauthorized"
      "501":
        description: >
          Opencode-specific VCS operations are not implemented: declared
          operations (vcs.apply, vcs.diff.raw) answer the typed
          not_implemented envelope {error, operation, detail}; unknown ids
          answer the standard NOT_IMPLEMENTED error envelope.
        content:
          application/json:
            schema:
              oneOf:
                - $ref: "../components/responses.yaml#/NotImplementable/content/application~1json/schema"
                - $ref: "../components/responses.yaml#/NotImplemented/content/application~1json/schema"

# ── Instance (opencode-protocol translation, SPEC-017 §3.10) ──
# C-GAP-031: /instance/* translates the opencode server protocol into
# native Consensus calls. The Consensus server is a singleton instance
# rooted at the process working directory. Fully public — the opencode
# contract probes these endpoints unauthenticated and expects 200 with
# real workspace data. Other upstream sub-paths (dispose, vcs/status,
# vcs/diff/raw, vcs/apply, command, agent, skill, lsp, formatter) return
# 501 NOT_IMPLEMENTED; unknown sub-paths return 404 NOT_FOUND.
instance:
  get:
    tags: [Opencode Shim]
    summary: List instances
    operationId: shimInstanceList
    description: |
      Singleton instance list: the Consensus server is one instance rooted
      at the workspace directory. Fully public — no auth required.
    responses:
      "200":
        description: Singleton instance list.
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: "../components/schemas.yaml#/InstanceInfo"

instancePath:
  get:
    tags: [Opencode Shim]
    summary: Get instance paths
    operationId: shimInstancePath
    description: |
      opencode PathInfo translation: home, state, config, worktree and
      directory for the instance workspace. Fully public — no auth required.
    responses:
      "200":
        description: Instance path info.
        content:
          application/json:
            schema:
              $ref: "../components/schemas.yaml#/InstancePathInfo"

instanceVCS:
  get:
    tags: [Opencode Shim]
    summary: Get VCS info
    operationId: shimInstanceVCS
    description: |
      opencode Vcs.Info translation: current branch and default branch of
      the workspace git repository, read live. Non-git workspaces return {}
      — never an error. Fully public — no auth required.
    responses:
      "200":
        description: VCS info (both fields optional; {} for non-git workspaces).
        content:
          application/json:
            schema:
              $ref: "../components/schemas.yaml#/VcsInfo"

instanceVCSDiff:
  get:
    tags: [Opencode Shim]
    summary: Get VCS diff
    operationId: shimInstanceVCSDiff
    description: |
      opencode Vcs.FileDiff translation: per-file additions, deletions and
      status for the workspace working tree. Clean or non-git workspaces
      return []. Fully public — no auth required.
    responses:
      "200":
        description: Per-file diff stats (possibly empty array).
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: "../components/schemas.yaml#/VcsFileDiff"

# ── Shared parameters (shim-local) ──
parameters:
  ShimSessionId:
    name: sessionId
    in: path
    required: true
    schema:
      type: string
      format: uuid
    description: UUID of the agent session.
  ShimMessageId:
    name: messageId
    in: path
    required: true
    schema:
      type: string
    description: Message ID in opencode "msg-{id}" format.
  ShimPermissionId:
    name: permissionId
    in: path
    required: true
    schema:
      type: string
    description: ID of the approval request (permission).
