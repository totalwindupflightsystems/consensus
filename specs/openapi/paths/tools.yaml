# Tools endpoint paths (SPEC-015 §3.4).
# axiom:trace work_item=interfaces-api-cli-01 spec=specs/018-openapi-contract.md plan=phase-5/task-5-1/step-5-1-1

# GET /api/v1/tools
tools:
  get:
    tags: [Tools]
    summary: List available tools
    operationId: listTools
    description: |
      Lists all tools in the registry. Supports filtering by status and hemisphere.
      Tools are the executable capabilities — SQL functions, HTTP endpoints,
      Go handlers, and subprocesses.
    security:
      - BearerAuth: []
    parameters:
      - $ref: "../components/parameters.yaml#/StatusFilter"
      - $ref: "../components/parameters.yaml#/HemisphereFilter"
    responses:
      "200":
        description: List of tools.
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: "../components/schemas.yaml#/Tool"
      "500":
        $ref: "../components/responses.yaml#/InternalError"

# GET /api/v1/tool-requests
toolRequests:
  get:
    tags: [Tools]
    summary: List tool execution requests
    operationId: listToolRequests
    description: |
      Lists up to 100 tool requests in oldest-first order. Admin and readonly
      keys may inspect all sessions. A session key is restricted to its own
      session. Completed and failed requests include their tool result.
    security:
      - BearerAuth: []
    parameters:
      - $ref: "../components/parameters.yaml#/SessionFilter"
      - $ref: "../components/parameters.yaml#/ToolRequestStatusFilter"
    responses:
      "200":
        description: Tool requests.
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: "../components/schemas.yaml#/ToolRequest"
      "401":
        $ref: "../components/responses.yaml#/Unauthorized"
      "403":
        $ref: "../components/responses.yaml#/Forbidden"
      "500":
        $ref: "../components/responses.yaml#/InternalError"

# GET /api/v1/tool-requests/{requestId}
toolRequest:
  get:
    tags: [Tools]
    summary: Get a tool execution request
    operationId: getToolRequest
    security:
      - BearerAuth: []
    parameters:
      - $ref: "../components/parameters.yaml#/ToolRequestId"
    responses:
      "200":
        description: Tool request detail, including its result when available.
        content:
          application/json:
            schema:
              $ref: "../components/schemas.yaml#/ToolRequest"
      "401":
        $ref: "../components/responses.yaml#/Unauthorized"
      "403":
        $ref: "../components/responses.yaml#/Forbidden"
      "404":
        $ref: "../components/responses.yaml#/NotFound"
      "500":
        $ref: "../components/responses.yaml#/InternalError"

# GET /api/v1/sessions/{sessionId}/tool-calls
sessionToolCalls:
  get:
    tags: [Tools]
    summary: List a session's tool-call lifecycle records
    operationId: listSessionToolCalls
    description: |
      Merges executor-backed tool_requests rows with planning staging_buffer
      rows whose cmd_type is tool_call_ref. Each item identifies its source and
      lifecycle status. Results are ordered oldest first.
    security:
      - BearerAuth: []
    parameters:
      - $ref: "../components/parameters.yaml#/SessionId"
    responses:
      "200":
        description: Merged session tool-call lifecycle records.
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: "../components/schemas.yaml#/SessionToolCall"
      "401":
        $ref: "../components/responses.yaml#/Unauthorized"
      "403":
        $ref: "../components/responses.yaml#/Forbidden"
      "500":
        $ref: "../components/responses.yaml#/InternalError"

# POST /api/v1/tools/{toolName}/execute
execute:
  post:
    tags: [Tools]
    summary: Execute a tool
    operationId: executeTool
    description: |
      Executes an internal tool (sql_function or go_native) within a session,
      or enqueues an external tool (http_endpoint or subprocess) for async dispatch.
      The tool must be enabled and in active status.
    security:
      - BearerAuth: []
    parameters:
      - $ref: "../components/parameters.yaml#/ToolName"
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: "../components/schemas.yaml#/ExecuteToolRequest"
    responses:
      "200":
        description: Tool execution result.
        content:
          application/json:
            schema:
              $ref: "../components/schemas.yaml#/ExecuteToolResponse"
      "400":
        $ref: "../components/responses.yaml#/BadRequest"
      "401":
        $ref: "../components/responses.yaml#/Unauthorized"
      "403":
        $ref: "../components/responses.yaml#/Forbidden"
      "404":
        $ref: "../components/responses.yaml#/NotFound"
      "409":
        $ref: "../components/responses.yaml#/Conflict"
      "500":
        $ref: "../components/responses.yaml#/InternalError"
