# Webhook ingestion endpoint (SPEC-013 §4).
# HMAC authentication replaces the global Bearer API-key requirement.
# WEBHOOK-1: declared + documented here, but NOT served at runtime yet —
# cmd/consensus/main.go mounts the exact `/webhooks/` route only, so
# /webhooks/{source} 404s. Pinned with x-not-implemented (the repo's
# declared-but-unserved convention) until the route carries {source}.

x-not-implemented: true

post:
  tags: [Webhooks]
  summary: Ingest a signed webhook payload
  operationId: ingestWebhook
  description: |
    Ingests the raw request body as an external event. The `{source}` value must
    match the name, source, or URL path of an enabled row in
    `webhook_registrations`. No Bearer API key is required; the server verifies
    an HMAC-SHA256 hex digest of the exact raw request body using the
    registration secret.

    Supply the digest in `X-Hub-Signature-256`, `X-Signature-256`, or
    `X-Signature` (checked in that order). A leading `sha256=` is optional.
    A missing or invalid signature does not reject the request: the event is
    stored with `signature_valid=false` and `status=quarantined`, and a new
    event still receives `202 Accepted`.

    Runtime note: this operation is the handler contract, but the current server
    mounts only the exact `/webhooks/` route. That mount does not match a
    source-bearing path, so `/webhooks/{source}` returns 404 until the Go router
    mount is changed to a wildcard route.
  security: []
  parameters:
    - name: source
      in: path
      required: true
      description: Registered webhook source, name, or URL-path lookup value.
      schema:
        type: string
      example: docs-demo
    - name: X-Hub-Signature-256
      in: header
      required: false
      description: Preferred HMAC-SHA256 hex signature; optional `sha256=` prefix.
      schema:
        type: string
      example: sha256=0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
    - name: X-Signature-256
      in: header
      required: false
      description: Fallback HMAC-SHA256 hex signature; optional `sha256=` prefix.
      schema:
        type: string
    - name: X-Signature
      in: header
      required: false
      description: Final fallback HMAC-SHA256 hex signature; optional `sha256=` prefix.
      schema:
        type: string
    - name: X-Event-Type
      in: header
      required: false
      description: Event type. Falls back to `X-GitHub-Event`, then `unknown`.
      schema:
        type: string
      example: ping
    - name: X-Delivery-ID
      in: header
      required: false
      description: External delivery identifier used for idempotent ingestion.
      schema:
        type: string
      example: delivery-001
  requestBody:
    required: true
    description: Raw payload bytes. Sign exactly the bytes sent on the wire.
    content:
      application/json:
        schema: {}
        example:
          event: ping
          message: hello
      application/octet-stream:
        schema:
          type: string
          format: binary
  responses:
    "202":
      description: New event accepted, including a new event with an invalid signature.
      content:
        application/json:
          schema:
            type: object
            required: [status]
            properties:
              status:
                type: string
                const: accepted
          example:
            status: accepted
    "200":
      description: Delivery ID was already ingested; returns the existing event ID when available.
      content:
        application/json:
          schema:
            type: object
            required: [status, event_id, message]
            properties:
              status:
                type: string
                const: duplicate
              event_id:
                type: integer
                format: int64
              message:
                type: string
          example:
            status: duplicate
            event_id: 42
            message: event already ingested
    "403":
      description: The matching webhook registration is disabled.
    "404":
      description: No webhook registration matches the source.
    "413":
      description: The request body exceeds the 1 MB limit.
    "429":
      description: The source exceeded the webhook token-bucket rate limit.
    "500":
      description: The request body could not be read or the event could not be stored.
