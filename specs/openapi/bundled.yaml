        - Opencode Shim
      summary: List instances
      operationId: shimInstanceList
      description: |
        Singleton instance list: the Consensus server is one instance rooted
        at the workspace directory. Fully public — no auth required.
      responses:
        '200':
          description: Singleton instance list.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/InstanceInfo'
  /instance/path:
    get:
      tags:
        - Opencode Shim
      summary: Get instance paths
      operationId: shimInstancePath
      description: |
        opencode PathInfo translation: home, state, config, worktree and
        directory for the instance workspace. Fully public — no auth required.
      responses:
        '200':
          description: Instance path info.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InstancePathInfo'
  /instance/vcs:
    get:
      tags:
        - Opencode Shim
      summary: Get VCS info
      operationId: shimInstanceVCS
      description: |
        opencode Vcs.Info translation: current branch and default branch of
        the workspace git repository, read live. Non-git workspaces return {}
        — never an error. Fully public — no auth required.
      responses:
        '200':
          description: VCS info (both fields optional; {} for non-git workspaces).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VcsInfo'
  /instance/vcs/diff:
    get:
      tags:
        - Opencode Shim
      summary: Get VCS diff
      operationId: shimInstanceVCSDiff
      description: |
        opencode Vcs.FileDiff translation: per-file additions, deletions and
        status for the workspace working tree. Clean or non-git workspaces
        return []. Fully public — no auth required.
      responses:
        '200':
          description: Per-file diff stats (possibly empty array).
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/VcsFileDiff'
components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      description: |
        API key prefixed with cs_ (e.g., cs_sk_a1b2c3d4...).

        Key types:
        - cs_ak_* : admin — full CRUD on all tables
        - cs_sk_* : session — CRUD within one session
        - cs_rk_* : readonly — SELECT on all tables
        - cs_wk_* : webhook — INSERT into external_events only
  schemas:
    HealthResponse:
      type: object
      required:
        - status
        - version
      properties:
        status:
          type: string
          example: healthy
        version:
          type: string
          example: 0.1.0
    Session:
      type: object
      required:
        - id
        - agent_name
        - model_id
        - status
        - context_budget
        - iteration
        - created_at
      properties:
        id:
          type: string
          format: uuid
        parent_id:
          type: string
          format: uuid
          nullable: true
          description: Parent session ID for sub-agents.
        agent_name:
          type: string
        model_id:
          type: string
        status:
          type: string
          enum:
            - booting
            - idle
            - thinking
            - planning
            - tool_exec
            - executing
            - waiting_sub
            - paused
            - completed
            - failed
          description: Current session state.
        goal:
          type: string
          nullable: true
          description: The task goal.
        context_budget:
          type: integer
          description: Token budget for the context window.
        tokens_used_in:
          type: integer
          format: int64
          description: Accumulated input tokens used.
        tokens_used_out:
          type: integer
          format: int64
          description: Accumulated output tokens used.
        iteration:
          type: integer
          format: int64
          description: Current iteration counter.
        heartbeat_at:
          type: string
          format: date-time
          description: Last known-alive timestamp.
        created_at:
          type: string
          format: date-time
        completed_at:
          type: string
          format: date-time
          nullable: true
          description: Timestamp when session completed or failed.
    schema:
      type: object
      required:
        - error
      properties:
        error:
          type: object
          required:
            - code
            - message
          properties:
            code:
              type: string
              description: Machine-readable error code.
              example: SESSION_NOT_FOUND
            message:
              type: string
              description: Human-readable error message.
              example: Session with id 'abc-123' does not exist.
            details:
              type: object
              additionalProperties: true
              description: Optional error-specific details.
    CreateSessionRequest:
      type: object
      required:
        - agent_name
        - goal
      properties:
        agent_name:
          type: string
          description: Semantic name for the agent.
        goal:
          type: string
          description: Task description injected into the system prompt.
        model_id:
          type: string
          description: LLM model identifier. If omitted, uses the first enabled model from the registry.
        context_budget:
          type: integer
          default: 128000
          description: Maximum token budget for the agent's context window.
        hitl_config:
          type: object
          additionalProperties: true
          description: Optional HITL configuration overrides.
    CreateSessionResponse:
      type: object
      required:
        - id
        - status
        - api_key
        - created_at
      properties:
        id:
          type: string
          format: uuid
          description: UUID of the created session.
        status:
          type: string
          enum:
            - booting
          description: Initial session status.
        api_key:
          type: string
          description: Session-scoped API key. Store this — it is not recoverable.
        created_at:
          type: string
          format: date-time
          description: Creation timestamp.
    UpdateSessionRequest:
      type: object
      required:
        - status
      properties:
        status:
          type: string
          enum:
            - pause
            - resume
            - cancel
          description: |
            Action to perform:
            - pause — pauses the session (must be in active state)
            - resume — resumes a paused session
            - cancel — fails the session immediately
    SendMessageRequest:
      type: object
      required:
        - content
      properties:
        content:
          type: string
          description: The message content.
        type:
          type: string
          enum:
            - user_instruction
            - user_correction
            - system_override
          default: user_instruction
          description: Message type.
    MessageReceivedResponse:
      type: object
      required:
        - status
        - session
      properties:
        status:
          type: string
          example: message_received
        session:
          type: string
          format: uuid
    MemoryEvent:
      type: object
      required:
        - id
        - session_id
        - type
        - iteration_created
        - created_at
      properties:
        id:
          type: integer
          format: int64
        type:
          type: string
          enum:
            - header
            - text_block
            - tool_call
            - tool_result
            - thinking
            - system
            - inherited_pointer
            - user_message
        content:
          type: string
          nullable: true
        summary_text:
          type: string
          nullable: true
          description: Compressed summary set by the compression worker.
        session_id:
          type: string
          format: uuid
        iteration_created:
          type: integer
          format: int64
        display_mode:
          type: string
          enum:
            - full
            - compressed
            - hidden
          default: full
          description: Current rendering state.
        created_at:
          type: string
          format: date-time
    ActiveContextItem:
      type: object
      required:
        - id
        - iteration_created
        - type
        - display_mode
      properties:
        id:
          type: integer
          format: int64
        iteration_created:
          type: integer
          format: int64
        type:
          type: string
          description: Event type from memory_events.
        display_mode:
          type: string
          enum:
            - full
            - compressed
            - hidden
        rendered_text:
          type: string
          nullable: true
          description: |
            Text to display based on display_mode:
            - full → original content
            - compressed → summary_text
            - hidden → null
    IterationCommit:
      type: object
      required:
        - iteration_id
        - session_id
        - active_pointers
        - rows_affected
        - created_at
      properties:
        iteration_id:
          type: integer
          format: int64
        session_id:
          type: string
          format: uuid
        active_pointers:
          type: array
          items:
            type: integer
            format: int64
          description: IDs of memory events active in this iteration.
        display_rules:
          description: Display rules for the iteration.
        llm_response:
          description: Structured LLM response from this iteration.
        sql_executed:
          type: array
          items:
            type: string
          description: SQL statements executed in this iteration.
        rows_affected:
          type: integer
          description: Number of database rows affected.
        created_at:
          type: string
          format: date-time
    Task:
      type: object
      required:
        - id
        - session_id
        - title
        - status
        - priority
        - prerequisite_ids
        - created_at
      properties:
        id:
          type: string
          format: uuid
        session_id:
          type: string
          format: uuid
        parent_task_id:
          type: string
          format: uuid
          nullable: true
        title:
          type: string
        description:
          type: string
          nullable: true
        status:
          type: string
          enum:
            - pending
            - claimed
            - in_progress
            - reviewed
            - published
            - failed
            - cancelled
        priority:
          type: integer
          minimum: 1
          maximum: 10
        locked_by_agent:
          type: string
          format: uuid
          nullable: true
          description: Session ID of the agent that currently holds the lock.
        prerequisite_ids:
          type: array
          items:
            type: string
            format: uuid
        result_memory_id:
          type: integer
          format: int64
          nullable: true
          description: Pointer to the memory event containing this task's output.
        created_at:
          type: string
          format: date-time
        claimed_at:
          type: string
          format: date-time
          nullable: true
        completed_at:
          type: string
          format: date-time
          nullable: true
    CreateTaskRequest:
      type: object
      required:
        - title
      properties:
        title:
          type: string
          description: Short, descriptive task title.
        description:
          type: string
          description: Detailed task description.
        priority:
          type: integer
          minimum: 1
          maximum: 10
          default: 5
          description: Priority (1 = lowest, 10 = highest).
        prerequisite_ids:
          type: array
          items:
            type: string
            format: uuid
          description: IDs of tasks that must be published before this one can be claimed.
    UpdateTaskRequest:
      type: object
      required:
        - status
      properties:
        status:
          type: string
          enum:
            - claimed
            - in_progress
            - reviewed
            - published
            - failed
            - cancelled
          description: New status. Must be a valid transition from the current state.
    Tool:
      type: object
      required:
        - id
        - name
        - description
        - hemisphere
        - handler_type
        - status
        - enabled
        - requires_approval
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        description:
          type: string
        hemisphere:
          type: string
          enum:
            - internal
            - external
        handler_type:
          type: string
          enum:
            - sql_function
            - http_endpoint
            - go_native
            - subprocess
        status:
          type: string
          enum:
            - active
            - testing
            - deprecated
            - disabled
        enabled:
          type: boolean
        requires_approval:
          type: boolean
          description: Whether human approval is required before executing this tool.
    ExecuteToolRequest:
      type: object
      required:
        - session_id
      properties:
        session_id:
          type: string
          format: uuid
          description: Session to execute within.
        parameters:
          type: object
          additionalProperties: true
          description: Tool-specific parameters matching the tool's parameter_schema.
    ExecuteToolResponse:
      type: object
      required:
        - tool_name
        - is_error
      properties:
        tool_name:
          type: string
        result:
          description: Tool execution result.
        rows_affected:
          type: integer
          format: int64
        is_error:
          type: boolean
          description: Whether the execution produced an error.
        error:
          type: string
          description: Error message if is_error is true.
    Skill:
      type: object
      required:
        - id
        - name
        - enabled
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        metadata:
          description: Lightweight skill metadata (~100 tokens).
        enabled:
          type: boolean
    SkillDetail:
      type: object
      required:
        - id
        - name
        - instructions
        - enabled
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        metadata:
          description: Lightweight skill metadata.
        instructions:
          type: string
          description: Full skill instructions (can be thousands of tokens).
        linked_tool_ids:
          type: array
          items:
            type: string
            format: uuid
          description: IDs of tools this skill depends on.
        enabled:
          type: boolean
    Approval:
      type: object
      required:
        - id
        - session_id
        - iteration
        - request_type
        - description
        - risk_level
        - status
        - created_at
      properties:
        id:
          type: string
          format: uuid
        session_id:
          type: string
          format: uuid
        iteration:
          type: integer
          format: int64
        request_type:
          type: string
          enum:
            - tool_execution
            - destructive_action
            - budget_override
            - schema_change
            - sub_agent_spawn
            - custom
        description:
          type: string
        risk_level:
          type: string
          enum:
            - low
            - medium
            - high
            - critical
        context:
          description: Approval context (agent monologue, previous actions, etc.).
        target_tool:
          type: string
          nullable: true
          description: Tool being requested for execution.
        target_sql:
          type: string
          nullable: true
          description: SQL being requested for execution.
        status:
          type: string
          enum:
            - pending
            - approved
            - rejected
            - expired
            - modified
        reviewer_id:
          type: string
          nullable: true
        review_notes:
          type: string
          nullable: true
        modified_sql:
          type: string
          nullable: true
          description: Modified SQL when decision is "modified".
        created_at:
          type: string
          format: date-time
        reviewed_at:
          type: string
          format: date-time
          nullable: true
        expires_at:
          type: string
          format: date-time
          nullable: true
    ApprovalReviewRequest:
      type: object
      required:
        - decision
      properties:
        decision:
          type: string
          enum:
            - approved
            - rejected
            - modified
          description: Review decision.
        notes:
          type: string
          description: Optional review notes.
        modified_sql:
          type: string
          description: Required when decision is "modified".
    Metrics:
      type: object
      required:
        - active_sessions
        - pending_tasks
        - pending_approvals
        - total_sessions
      properties:
        active_sessions:
          type: integer
          description: Number of sessions in active statuses.
        pending_tasks:
          type: integer
          description: Number of pending tasks.
        pending_approvals:
          type: integer
          description: Number of pending approval requests.
        total_sessions:
          type: integer
          description: Total number of sessions in the database.
        total_cost_usd:
          type: number
          format: double
          description: Total cumulative cost across all sessions.
    BillingEntry:
      type: object
      required:
        - id
        - session_id
        - iteration
        - model_id
        - category
        - prompt_tokens
        - completion_tokens
        - cost_usd
        - recorded_at
      properties:
        id:
          type: integer
          format: int64
        session_id:
          type: string
          format: uuid
        iteration:
          type: integer
          format: int64
        model_id:
          type: string
        category:
          type: string
          enum:
            - cognition
            - compression
            - embedding
            - tool_call
        prompt_tokens:
          type: integer
          format: int64
        completion_tokens:
          type: integer
          format: int64
        cache_read_tokens:
          type: integer
          format: int64
        cache_write_tokens:
          type: integer
          format: int64
        cost_usd:
          type: number
          format: double
        recorded_at:
          type: string
          format: date-time
    SessionBilling:
      type: object
      required:
        - session_id
        - total_cost_usd
        - entries
      properties:
        session_id:
          type: string
          format: uuid
        total_cost_usd:
          type: number
          format: double
        total_prompt_tokens:
          type: integer
          format: int64
        total_completion_tokens:
          type: integer
          format: int64
        entries:
          type: array
          items:
            $ref: '#/components/schemas/BillingEntry'
    Config:
      type: object
      properties:
        llm:
          type: object
          additionalProperties: true
          description: LLM configuration (model, provider, etc.).
        hitl:
          type: object
          additionalProperties: true
          description: HITL configuration.
        harness:
          type: object
          additionalProperties: true
          description: Harness configuration.
        database:
          type: object
          additionalProperties: true
          description: Database configuration.
        logging:
          type: object
          additionalProperties: true
          description: Logging configuration.
        system_settings:
          type: object
          additionalProperties: true
          description: Raw system_settings table values.
    APIKeyEntry:
      type: object
      required:
        - id
        - key_prefix
        - scope
        - created_at
      properties:
        id:
          type: string
          format: uuid
        key_prefix:
          type: string
          description: Key prefix (first 8 chars).
        scope:
          type: string
          enum:
            - admin
            - session
            - readonly
            - webhook
        session_id:
          type: string
          format: uuid
          nullable: true
        expires_at:
          type: string
          format: date-time
          nullable: true
        created_at:
          type: string
          format: date-time
    CreateAPIKeyRequest:
      type: object
      required:
        - scope
      properties:
        scope:
          type: string
          enum:
            - admin
            - session
            - readonly
            - webhook
          description: Key scope.
        session_id:
          type: string
          format: uuid
          description: Required for session-scoped keys.
        expires_in:
          type: integer
          description: Seconds until expiration.
    CreateAPIKeyResponse:
      type: object
      required:
        - id
        - key_prefix
        - api_key
        - scope
        - created_at
      properties:
        id:
          type: string
          format: uuid
        key_prefix:
          type: string
          description: First 8 characters for identification.
        api_key:
          type: string
          description: The full API key. Store this — it is not recoverable.
        scope:
          type: string
        created_at:
          type: string
          format: date-time
    RevokeAPIKeyResponse:
      type: object
      required:
        - status
        - key_id
        - revoked_at
      properties:
        status:
          type: string
          example: revoked
        key_id:
          type: string
          format: uuid
        revoked_at:
          type: string
          format: date-time
    InstanceInfo:
      type: object
      required:
        - id
        - path
        - createdAt
        - updatedAt
      properties:
        id:
          type: string
          description: Stable singleton instance id (derived from the workspace directory).
        path:
          type: string
          description: Workspace directory the instance is rooted at.
        createdAt:
          type: string
          format: date-time
          description: Server process start time.
        updatedAt:
          type: string
          format: date-time
          description: Time of the last update to the instance list.
      description: A single Consensus shim instance (the server is a singleton).
    InstancePathInfo:
      type: object
      required:
        - home
        - state
        - config
        - worktree
        - directory
      properties:
        home:
          type: string
          description: User home directory.
        state:
          type: string
          description: Consensus state directory.
        config:
          type: string
          description: Consensus config file path.
        worktree:
          type: string
          description: Git worktree root of the workspace (falls back to directory).
        directory:
          type: string
          description: Workspace directory.
      description: opencode PathInfo translation (SPEC-017 §3.10).
    VcsInfo:
      type: object
      properties:
        branch:
          type: string
          description: Current git branch (absent for non-git or detached workspaces).
        default_branch:
          type: string
          description: Default branch from origin HEAD or init.defaultBranch.
      description: opencode Vcs.Info translation — both fields optional.
    VcsFileDiff:
      type: object
      required:
        - file
        - additions
        - deletions
      properties:
        file:
          type: string
          description: Changed file path relative to the workspace.
        additions:
          type: integer
          description: Added line count.
        deletions:
          type: integer
          description: Deleted line count.
        status:
          type: string
          enum:
            - added
            - deleted
            - modified
          description: Change classification.
      description: opencode Vcs.FileDiff translation — patch omitted (optional upstream).
  parameters:
    StatusFilter:
      name: status
      in: query
      schema:
        type: string
      description: Filter by comma-separated status values.
    SessionId:
      name: sessionId
      in: path
      required: true
      schema:
        type: string
        format: uuid
      description: UUID of the agent session.
    TypeFilter:
      name: type
      in: query
      schema:
        type: string
      description: Filter memory events by type.
    Limit:
      name: limit
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 1000
        default: 50
      description: Maximum number of results to return.
    MemoryId:
      name: memoryId
      in: path
      required: true
      schema:
        type: integer
        format: int64
      description: ID of the memory event.
    TaskId:
      name: taskId
      in: path
      required: true
      schema:
        type: string
        format: uuid
      description: UUID of the task.
    HemisphereFilter:
      name: hemisphere
      in: query
      schema:
        type: string
        enum:
          - internal
          - external
      description: Filter tools by hemisphere.
    ToolName:
      name: toolName
      in: path
      required: true
      schema:
        type: string
      description: Name of the tool as registered in tools_registry.
    SkillName:
      name: skillName
      in: path
      required: true
      schema:
        type: string
      description: Name of the skill as registered in skills_registry.
    SessionFilter:
      name: session_id
      in: query
      schema:
        type: string
        format: uuid
      description: Filter by session ID.
    ApprovalId:
      name: approvalId
      in: path
      required: true
      schema:
        type: string
        format: uuid
      description: UUID of the approval request.
    ApiKeyId:
      name: keyId
      in: path
      required: true
      schema:
        type: string
        format: uuid
      description: UUID of the API key.
    ShimSessionId:
      name: sessionId
      in: path
      required: true
      schema:
        type: string
        format: uuid
      description: UUID of the agent session.
    ShimMessageId:
      name: messageId
      in: path
      required: true
      schema:
        type: string
      description: Message ID in opencode "msg-{id}" format.
    ShimPermissionId:
      name: permissionId
      in: path
      required: true
      schema:
        type: string
      description: ID of the approval request (permission).
  responses:
    Unauthorized:
      description: Missing or invalid API key.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/schema'
    InternalError:
      description: Unexpected server error.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/schema'
    BadRequest:
      description: Invalid request — malformed JSON or missing required fields.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/schema'
    Forbidden:
      description: API key scope does not permit this action.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/schema'
    NotFound:
      description: Resource does not exist.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/schema'
    Conflict:
      description: Resource in wrong state for this action.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/schema'
    NotImplemented:
      description: Endpoint is a registered stub surface — not implemented.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/schema'
