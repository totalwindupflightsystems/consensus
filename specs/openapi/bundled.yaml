openapi: 3.1.0
info:
  title: Consensus Agent Runtime
  description: |
    Database-native cognitive architecture for AI agents.

    All state lives in the database. The API writes to the same tables the agent reads from.
    There is no separate API state — the database is the single source of truth.

    ## Key Concepts

    - **Sessions** — Every agent instance is a session row. RLS isolation, billing, lifecycle.
    - **Memory Events** — Immutable append-only ledger. Display state managed via display_modes.
    - **Transactions** — Atomic cognition: every thought is a SQL transaction.
    - **Tools & Skills** — Progressive disclosure: metadata always visible, full instructions on demand.
    - **HITL Approvals** — Human-in-the-loop: pause for review before destructive actions.

    ## Authentication

    All endpoints except `/api/v1/health` require a Bearer API key:
    - `cs_ak_*` : admin — full CRUD
    - `cs_sk_*` : session — scoped to one session
    - `cs_rk_*` : readonly — SELECT only
    - `cs_wk_*` : webhook — event ingestion only

    Keys are SHA-256 hashed before storage. The full key is only returned at creation time.
  version: 0.1.0
  contact:
    name: Consensus
    url: https://github.com/wojons/consensus
servers:
  - url: http://localhost:8090
    description: Local development (SQLite or local Postgres)
  - url: https://{host}
    description: Remote deployment (any Postgres provider)
    variables:
      host:
        default: localhost:8090
security:
  - BearerAuth: []
tags:
  - name: System
    description: Health check (no auth)
  - name: Sessions
    description: Agent session lifecycle
  - name: Memory
    description: Agent memory and context inspection
  - name: Tasks
    description: Task queue management
  - name: Tools
    description: Tool and skill registry
  - name: Approvals
    description: Human-in-the-loop approvals
  - name: Metrics
    description: System metrics, billing, and configuration
  - name: Auth
    description: API key management
  - name: Opencode Shim
    description: |
      opencode protocol shim (SPEC-017) — translates the opencode server protocol into native Consensus calls. Mounted at the server root alongside the native /api/v1 REST API.
paths:
  /api/v1/health:
    get:
      tags:
        - System
      summary: Health check
      operationId: healthCheck
      description: Returns server health status. No authentication required.
      security: []
      responses:
        '200':
          description: Server is healthy.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
  /api/v1/sessions:
    post:
      tags:
        - Sessions
      summary: Create a new agent session
      operationId: createSession
      description: |
        Creates a new agent session and returns its ID, status, and a session-scoped API key.
        Only admin-scoped API keys can create sessions.
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateSessionRequest'
      responses:
        '201':
          description: Session created successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateSessionResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalError'
    get:
      tags:
        - Sessions
      summary: List sessions
      operationId: listSessions
      description: |
        Lists agent sessions with optional status filter.
        Session-scoped keys only see their own session.
        Admin and readonly keys see all sessions.
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/StatusFilter'
      responses:
        '200':
          description: List of sessions.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Session'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/v1/sessions/{sessionId}:
    get:
      tags:
        - Sessions
      summary: Get session details
      operationId: getSession
      description: |
        Returns full details for a single session.
        Session-scoped keys can only access their own session.
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/SessionId'
      responses:
        '200':
          description: Session details.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Session'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
    patch:
      tags:
        - Sessions
      summary: Update session status
      operationId: updateSession
      description: |
        Pause, resume, or cancel a session.
        - pause: transitions session from active state to paused
        - resume: transitions session from paused to idle
        - cancel: transitions session to failed and sets completed_at
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/SessionId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateSessionRequest'
      responses:
        '200':
          description: Updated session.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Session'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalError'
    delete:
      tags:
        - Sessions
      summary: Soft-delete a session
      operationId: deleteSession
      description: |
        Soft-deletes a session by setting it to failed with completed_at.
        Only admin keys may delete sessions.
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/SessionId'
      responses:
        '200':
          description: Session deleted.
          content:
            application/json:
              schema:
                type: object
                required:
                  - status
                properties:
                  status:
                    type: string
                    example: deleted
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/v1/sessions/{sessionId}/message:
    post:
      tags:
        - Sessions
      summary: Send a message to an agent session
      operationId: sendMessage
      description: |
        Sends a message to a running agent session. The message is inserted into
        memory_events and the session is transitioned to 'thinking' if idle.
        If the session is paused, the message is queued for the next iteration.
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/SessionId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SendMessageRequest'
      responses:
        '200':
          description: Message received.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageReceivedResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/v1/sessions/{sessionId}/memory:
    get:
      tags:
        - Memory
      summary: List memory events
      operationId: listMemory
      description: |
        Lists memory events for a session, ordered by ID descending (newest first).
        Supports type filtering and limit.
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/SessionId'
        - $ref: '#/components/parameters/TypeFilter'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: List of memory events.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/MemoryEvent'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/v1/sessions/{sessionId}/memory/{memoryId}:
    get:
      tags:
        - Memory
      summary: Get a single memory event
      operationId: getMemoryEvent
      description: Returns a single memory event by its ID.
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/SessionId'
        - $ref: '#/components/parameters/MemoryId'
      responses:
        '200':
          description: Memory event details.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MemoryEvent'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/v1/sessions/{sessionId}/context:
    get:
      tags:
        - Memory
      summary: Get active context (rendered)
      operationId: getActiveContext
      description: |
        Returns the active context view for a session — memory events rendered
        according to their display_mode (full, compressed, or hidden).
        This is what the harness formats into Markdown for the LLM.
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/SessionId'
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 1000
            default: 200
          description: Maximum context items to return.
      responses:
        '200':
          description: Rendered active context items.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ActiveContextItem'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/v1/sessions/{sessionId}/iterations:
    get:
      tags:
        - Memory
      summary: List iteration commits
      operationId: listIterations
      description: |
        Lists iteration commits for a session — each commit records the active
        memory pointers, display rules, LLM response, and SQL executed at that
        point in time.
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/SessionId'
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 50
          description: Maximum iterations to return.
      responses:
        '200':
          description: List of iteration commits.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/IterationCommit'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/v1/sessions/{sessionId}/tasks:
    post:
      tags:
        - Tasks
      summary: Create a task
      operationId: createTask
      description: Creates a new task in the given session's work queue.
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/SessionId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateTaskRequest'
      responses:
        '201':
          description: Task created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Task'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalError'
    get:
      tags:
        - Tasks
      summary: List tasks for a session
      operationId: listTasks
      description: Lists tasks for a session, optionally filtered by status.
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/SessionId'
        - $ref: '#/components/parameters/StatusFilter'
      responses:
        '200':
          description: List of tasks.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Task'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/v1/tasks/{taskId}:
    patch:
      tags:
        - Tasks
      summary: Update task status
      operationId: updateTask
      description: |
        Updates the status of a task. Valid transitions:
        - pending → claimed, in_progress, failed, cancelled
        - claimed → in_progress, failed, cancelled
        - in_progress → reviewed, failed, cancelled
        - reviewed → published
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/TaskId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateTaskRequest'
      responses:
        '200':
          description: Updated task.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Task'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/v1/tasks/{taskId}/claim:
    post:
      tags:
        - Tasks
      summary: Claim a task
      operationId: claimTask
      description: |
        Claims a pending task by locking it to the requesting session.
        Only one session can hold the lock at a time.
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/TaskId'
      responses:
        '200':
          description: Task claimed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Task'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/v1/tools:
    get:
      tags:
        - Tools
      summary: List available tools
      operationId: listTools
      description: |
        Lists all tools in the registry. Supports filtering by status and hemisphere.
        Tools are the executable capabilities — SQL functions, HTTP endpoints,
        Go handlers, and subprocesses.
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/StatusFilter'
        - $ref: '#/components/parameters/HemisphereFilter'
      responses:
        '200':
          description: List of tools.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Tool'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/v1/tools/{toolName}/execute:
    post:
      tags:
        - Tools
      summary: Execute a tool
      operationId: executeTool
      description: |
        Executes an internal tool (sql_function or go_native) within a session,
        or enqueues an external tool (http_endpoint or subprocess) for async dispatch.
        The tool must be enabled and in active status.
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/ToolName'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ExecuteToolRequest'
      responses:
        '200':
          description: Tool execution result.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExecuteToolResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/v1/skills:
    get:
      tags:
        - Tools
      summary: List skill metadata (progressive disclosure)
      operationId: listSkills
      description: |
        Lists skill metadata only — lightweight summaries (~100 tokens each).
        This is the "progressive disclosure" first layer. To get full
        instructions, use GET /api/v1/skills/{skillName}.
      security:
        - BearerAuth: []
      responses:
        '200':
          description: List of skills (metadata only).
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Skill'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/v1/skills/{skillName}:
    get:
      tags:
        - Tools
      summary: Get full skill instructions
      operationId: getSkill
      description: |
        Returns full skill details including the complete instructions text
        (which can be thousands of tokens). This is the second layer of
        progressive disclosure — only call this when the skill is actually needed.
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/SkillName'
      responses:
        '200':
          description: Full skill details.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SkillDetail'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/v1/approvals:
    get:
      tags:
        - Approvals
      summary: List pending approvals
      operationId: listApprovals
      description: |
        Lists all pending approval requests, ordered by risk level (critical first).
        Optionally filter by session. Admin scope only.
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/SessionFilter'
      responses:
        '200':
          description: List of pending approvals.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Approval'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/v1/approvals/{approvalId}:
    get:
      tags:
        - Approvals
      summary: Get approval details
      operationId: getApproval
      description: Returns full details for a single approval request.
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/ApprovalId'
      responses:
        '200':
          description: Approval details.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Approval'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/v1/approvals/{approvalId}/review:
    post:
      tags:
        - Approvals
      summary: Review a pending approval
      operationId: reviewApproval
      description: |
        Approve, reject, or modify a pending approval request.
        - approved: resumes the associated session from paused to idle
        - rejected: permanently rejects the request
        - modified: records the modified_sql and sets status to modified
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/ApprovalId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ApprovalReviewRequest'
      responses:
        '200':
          description: Reviewed approval.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Approval'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/v1/sessions/{sessionId}/approvals:
    get:
      tags:
        - Approvals
      summary: List approvals for a session
      operationId: listSessionApprovals
      description: |
        Lists approval requests for a specific session.
        Default filter: pending only. Use status=all for all statuses.
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/SessionId'
        - name: status
          in: query
          schema:
            type: string
            default: pending
          description: Filter by status (pending, all).
      responses:
        '200':
          description: List of approvals for the session.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Approval'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/v1/metrics:
    get:
      tags:
        - Metrics
      summary: System-wide metrics
      operationId: getMetrics
      description: |
        Returns system-wide metrics including active sessions, pending tasks,
        pending approvals, total sessions, and cumulative cost.
        Admin or readonly scope required.
      security:
        - BearerAuth: []
      responses:
        '200':
          description: System metrics.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Metrics'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/v1/sessions/{sessionId}/billing:
    get:
      tags:
        - Metrics
      summary: Per-session cost breakdown
      operationId: getSessionBilling
      description: |
        Returns the complete billing breakdown for a session —
        per-iteration token usage and cost, plus totals.
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/SessionId'
      responses:
        '200':
          description: Session billing details.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionBilling'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/v1/config:
    get:
      tags:
        - Metrics
      summary: System configuration
      operationId: getConfig
      description: |
        Returns the current system configuration including LLM, HITL,
        harness, database, and logging settings. Admin scope required.
      security:
        - BearerAuth: []
      responses:
        '200':
          description: System configuration.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Config'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/v1/auth/keys:
    post:
      tags:
        - Auth
      summary: Create a new API key
      operationId: createAPIKey
      description: |
        Creates a new API key with the specified scope. Returns the full key
        value — store it immediately, it is not recoverable.
        Admin scope required.
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateAPIKeyRequest'
      responses:
        '201':
          description: API key created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateAPIKeyResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalError'
    get:
      tags:
        - Auth
      summary: List API keys
      operationId: listAPIKeys
      description: |
        Lists all API keys (prefix and scope only — no hashes or full keys).
        Admin scope required.
      security:
        - BearerAuth: []
      responses:
        '200':
          description: List of API keys (prefixes only).
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/APIKeyEntry'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/v1/auth/keys/{keyId}:
    delete:
      tags:
        - Auth
      summary: Revoke an API key
      operationId: revokeAPIKey
      description: |
        Revokes an API key by setting its expiration to now.
        Admin scope required.
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/ApiKeyId'
      responses:
        '200':
          description: Key revoked.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RevokeAPIKeyResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
  /global/health:
    get:
      tags:
        - Opencode Shim
      summary: Shim health check
      operationId: shimGlobalHealth
      description: |
        Returns shim health status. No authentication required — the shim
        auth middleware skips this path.
      security: []
      responses:
        '200':
          description: Shim is healthy.
          content:
            application/json:
              schema:
                type: object
                required:
                  - healthy
                  - version
                properties:
                  healthy:
                    type: boolean
                    example: true
                  version:
                    type: string
                    example: consensus-0.1.0
  /global/event:
    get:
      tags:
        - Opencode Shim
      summary: Global SSE event stream
      operationId: shimGlobalEvent
      description: |
        SSE event stream mapping Consensus memory events to opencode event
        types (session.updated, permission.requested, message.created, ...).
        The most recent ~50 stored events are replayed on connect, then live
        events stream until the client disconnects. Optional ?session_id=
        scopes the stream to one session.
      responses:
        '200':
          description: SSE event stream (text/event-stream).
          content:
            text/event-stream:
              schema:
                type: string
        '401':
          $ref: '#/components/responses/Unauthorized'
  /session:
    get:
      tags:
        - Opencode Shim
      summary: List sessions (opencode format)
      operationId: shimListSessions
      description: |
        Lists sessions newest first, max 50. Optional comma-separated
        ?status= filter (e.g. ?status=idle,thinking).
      responses:
        '200':
          description: Array of sessions in opencode format.
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  additionalProperties: true
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'
    post:
      tags:
        - Opencode Shim
      summary: Create a session
      operationId: shimCreateSession
      description: |
        Creates a Consensus session. Body fields: title (maps to the
        Consensus agent_name, defaults to "opencode-agent"), goal, model.
        The response includes the generated api_key for the session.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                title:
                  type: string
                goal:
                  type: string
                model:
                  type: string
      responses:
        '200':
          description: Created session with api_key.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'
  /session/{sessionId}:
    get:
      tags:
        - Opencode Shim
      summary: Get session details
      operationId: shimGetSession
      description: |
        Returns one session in opencode format. opencode-specific subpaths
        (prompt_async, shell, command, share, summarize, init, fork, revert)
        return 501 NOT_IMPLEMENTED; unknown subpaths return 404.
      parameters:
        - $ref: '#/components/parameters/ShimSessionId'
      responses:
        '200':
          description: Session details.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      tags:
        - Opencode Shim
      summary: Update a session
      operationId: shimUpdateSession
      description: |
        Updates session properties (title, status, goal). opencode status
        values are mapped: pause/paused → paused, resume/resumed/idle → idle,
        cancel/cancelled → failed.
      parameters:
        - $ref: '#/components/parameters/ShimSessionId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                title:
                  type: string
                status:
                  type: string
                goal:
                  type: string
      responses:
        '200':
          description: 'Updated session (or {"status": "updated"}).'
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
    delete:
      tags:
        - Opencode Shim
      summary: Delete a session
      operationId: shimDeleteSession
      description: |
        Marks the session failed with a completed_at timestamp (soft delete).
        Returns {"status": "deleted"}.
      parameters:
        - $ref: '#/components/parameters/ShimSessionId'
      responses:
        '200':
          description: Deletion confirmation.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: deleted
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'
  /session/{sessionId}/abort:
    post:
      tags:
        - Opencode Shim
      summary: Abort a session
      operationId: shimAbortSession
      description: |
        Marks the session failed with a completed_at timestamp.
        Returns {"status": "aborted"}.
      parameters:
        - $ref: '#/components/parameters/ShimSessionId'
      responses:
        '200':
          description: Abort confirmation.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: aborted
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'
  /session/{sessionId}/message:
    get:
      tags:
        - Opencode Shim
      summary: List session messages
      operationId: shimListMessages
      description: |
        Lists the session's messages (memory events) in opencode format.
      parameters:
        - $ref: '#/components/parameters/ShimSessionId'
      responses:
        '200':
          description: Array of messages.
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  additionalProperties: true
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      tags:
        - Opencode Shim
      summary: Send a message to a session
      operationId: shimSendMessage
      description: |
        Sends a user instruction. Body: {"parts": [{"type": "text", "text":
        "..."}]}. Wakes idle/booting sessions to "thinking" for harness
        pickup. Returns an assistant acknowledgement message.
      parameters:
        - $ref: '#/components/parameters/ShimSessionId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - parts
              properties:
                parts:
                  type: array
                  items:
                    type: object
                    properties:
                      type:
                        type: string
                        example: text
                      text:
                        type: string
      responses:
        '200':
          description: Assistant acknowledgement message.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /session/{sessionId}/message/{messageId}:
    get:
      tags:
        - Opencode Shim
      summary: Get a single message
      operationId: shimGetMessage
      description: |
        Returns one message by ID (opencode "msg-{id}" format).
      parameters:
        - $ref: '#/components/parameters/ShimSessionId'
        - $ref: '#/components/parameters/ShimMessageId'
      responses:
        '200':
          description: Message with info and parts.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /session/{sessionId}/children:
    get:
      tags:
        - Opencode Shim
      summary: List child sessions
      operationId: shimListSessionChildren
      description: |
        Lists sessions whose parent_id is the given session, newest first,
