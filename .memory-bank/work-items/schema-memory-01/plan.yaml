version: 1
work_item:
  id: schema-memory-01
  jira_key: null
  repo: wojons/conscientiousness
  pr_branch: axiom/schema-memory-01
meta_planning:
  notes_md_path: .memory-bank/work-items/schema-memory-01/meta-planning.md
plan:
  phases:
    - id: phase-1
      title: Core Tables & Memory Ledger (SPEC-002, SPEC-003, SPEC-011)
      tasks:
        - id: task-1-1
          title: Create all core tables from SPEC-003 §2 and SPEC-011 §12
          spec_ref: specs/003-database.md,specs/011-canonical-definitions.md,specs/002-memory.md
          steps:
            - id: step-1-1-1
              title: Write CREATE TABLE for core identity tables
              command: /axiom-step
              spec_ref: specs/003-database.md,specs/011-canonical-definitions.md
              description: |
                sessions (canonical status CHECK from SPEC-011 §1),
                iteration_commits (with llm_response JSONB, sql_executed TEXT[], rows_affected from SPEC-011 §11),
                audit_logs (SPEC-011 §12.3),
                system_settings (SPEC-011 §12.2),
                agent_messages (SPEC-011 §12.1).
              inputs: {}
              expected_outputs:
                - migrations/001_initial_schema.sql (sessions, iteration_commits, audit_logs, system_settings, agent_messages blocks)
              verification:
                - type: spec_agent
                  command: /axiom-verify
                  required: true
                  timeout_seconds: 300
            - id: step-1-1-2
              title: Write CREATE TABLE for memory subsystem tables
              command: /axiom-step
              spec_ref: specs/002-memory.md,specs/003-database.md,specs/011-canonical-definitions.md
              description: |
                memory_events (append-only, NO display_mode column, CHECK on 8 canonical type values from SPEC-011 §3.5),
                display_modes (separate mutable table, CHECK mode IN full/compressed/hidden, PK on memory_id),
                memory_pages (with linked_page_ids BIGINT[], UNIQUE(name, session_id)),
                compression_queue (event_id, current_tier, next_tier, status, attempts),
                model_registry (tier CHECK 1/2/3, max_context, cost columns, classifier_tags).
              inputs: {}
              expected_outputs:
                - migrations/001_initial_schema.sql (memory_events, display_modes, memory_pages, compression_queue, model_registry blocks)
              verification:
                - type: qa_agent
                  command: /axiom-verify
                  required: true
                  timeout_seconds: 300
            - id: step-1-1-3
              title: Write CREATE TABLE for task, tool, and billing tables
              command: /axiom-step
              spec_ref: specs/003-database.md,specs/011-canonical-definitions.md
              description: |
                tasks (canonical status CHECK from SPEC-011 §2),
                tool_requests (canonical status pending/executing/completed/failed/timeout),
                tool_results,
                tools_registry (canonical from SPEC-011 §4.2.1: status, hemisphere, handler_type CHECKs),
                skills_registry (SPEC-011 §4.2.2: linked_tool_ids UUID[]),
                agent_billing (SPEC-011 §6.2: cache tokens, category CHECK cognition/compression/embedding/tool_call, NUMERIC(12,6) cost),
                workflows,
                custom_agent_tools (SPEC-011 §5.2: UNIQUE(name), status CHECK draft/testing/active/deprecated, language CHECK),
                tool_files.
              inputs: {}
              expected_outputs:
                - migrations/001_initial_schema.sql (tasks, tool_requests, tool_results, tools_registry, skills_registry, agent_billing, workflows, custom_agent_tools, tool_files blocks)
              verification:
                - type: spec_agent
                  command: /axiom-verify
                  required: true
                  timeout_seconds: 300
            - id: step-1-1-4
              title: Add all indexes and unique constraints from SPEC-003
              command: /axiom-step
              spec_ref: specs/003-database.md
              description: |
                idx_sessions_parent, idx_sessions_status (partial), idx_memory_session, idx_memory_embedding (ivfflat),
                idx_iteration_session, idx_tasks_session_status, idx_tasks_locked_by, idx_tool_req_pending,
                idx_tool_result_request, idx_billing_session, idx_billing_recorded, idx_tool_files_session,
                idx_quarantine_pending (partial), idx_messages_target, idx_audit_session,
                idx_session_iteration UNIQUE, idx_one_active_lock UNIQUE.
              inputs: {}
              expected_outputs:
                - migrations/001_initial_schema.sql (index blocks)
              verification:
                - type: qa_agent
                  command: /axiom-verify
                  required: true
                  timeout_seconds: 300
        - id: task-1-2
          title: Define active_context_view and memory_pages resolution
          spec_ref: specs/002-memory.md,specs/011-canonical-definitions.md
          steps:
            - id: step-1-2-1
              title: Create active_context_view SQL VIEW
              command: /axiom-step
              spec_ref: specs/002-memory.md,specs/011-canonical-definitions.md
              description: |
                CTE active_ids from iteration_commits via unnest(active_pointers).
                LEFT JOIN display_modes on dm.memory_id = me.id.
                CASE: compressed + summary_text IS NOT NULL → summary_text, hidden → NULL, else content.
                Session isolation: current_setting('conscience.session_id')::UUID.
                DISTINCT ON (id) for page deduplication.
                string_agg() Markdown aggregation query for prompt assembly.
              inputs: {}
              expected_outputs:
                - migrations/001_initial_schema.sql (active_context_view + markdown aggregation blocks)
              verification:
                - type: spec_agent
                  command: /axiom-verify
                  required: true
                  timeout_seconds: 300
            - id: step-1-2-2
              title: Document memory_pages linked_page_ids resolution CTE
              command: /axiom-step
              spec_ref: specs/002-memory.md,specs/003-database.md
              description: |
                Resolution expands both target_ids and linked_page_ids.
                Single-level nesting only (linked_page_ids expanded once, not recursively).
                direct_ids CTE → unnest(target_ids).
                linked_ids CTE → JOIN memory_pages on linked_page_ids.
                UNION + DISTINCT to merge.
              inputs: {}
              expected_outputs:
                - migrations/001_initial_schema.sql (linked_page_ids resolution CTE in comments or view block)
              verification:
                - type: qa_agent
                  command: /axiom-verify
                  required: true
                  timeout_seconds: 300

    - id: phase-2
      title: Security — RLS, Roles, Quarantine, Secrets (SPEC-005)
      spec_ref: specs/005-security.md,specs/003-database.md,specs/011-canonical-definitions.md
      tasks:
        - id: task-2-1
          title: Enable RLS on all core tables
          spec_ref: specs/005-security.md,specs/003-database.md,specs/011-canonical-definitions.md
          steps:
            - id: step-2-1-1
              title: ALTER TABLE ENABLE ROW LEVEL SECURITY for all multi-tenant tables
              command: /axiom-step
              spec_ref: specs/005-security.md,specs/003-database.md
              description: |
                memory_events, display_modes, iteration_commits, memory_pages, tasks,
                tool_requests, tool_results, tool_files, external_quarantine, agent_billing,
                compression_queue, agent_messages, audit_logs.
              inputs: {}
              expected_outputs:
                - migrations/001_initial_schema.sql (ENABLE ROW LEVEL SECURITY block)
              verification:
                - type: spec_agent
                  command: /axiom-verify
                  required: true
                  timeout_seconds: 300
            - id: step-2-1-2
              title: CREATE POLICY session_isolate_* on each RLS-enabled table
              command: /axiom-step
              spec_ref: specs/005-security.md,specs/011-canonical-definitions.md
              description: |
                FOR ALL USING (session_id = current_setting('conscience.session_id')::UUID).
                Applied to each table from step-2-1-1.
                Uses conscience.session_id namespace per SPEC-011 §9.
                hide_deleted policy on memory_events: FOR SELECT USING (deleted_at IS NULL) (SPEC-005 §Alt-Mode).
                recovery sees all policy for agent_recovery_mode role (SPEC-005 §Agent Recovery Mode).
              inputs: {}
              expected_outputs:
                - migrations/001_initial_schema.sql (RLS policy blocks)
              verification:
                - type: qa_agent
                  command: /axiom-verify
                  required: true
                  timeout_seconds: 300
        - id: task-2-2
          title: Implement the 4-role permission model
          spec_ref: specs/011-canonical-definitions.md,specs/003-database.md,specs/005-security.md
          steps:
            - id: step-2-2-1
              title: Write GRANT/REVOKE for agent_role
              command: /axiom-step
              spec_ref: specs/011-canonical-definitions.md,specs/003-database.md
              description: |
                GRANT SELECT, INSERT ON memory_events TO agent_role.
                GRANT SELECT, INSERT, UPDATE ON display_modes TO agent_role.
                GRANT SELECT, INSERT ON iteration_commits TO agent_role.
                GRANT SELECT, INSERT, UPDATE ON sessions TO agent_role (status, heartbeat only).
                GRANT SELECT, INSERT, UPDATE ON tasks TO agent_role.
                GRANT SELECT, INSERT ON tool_requests TO agent_role.
                GRANT SELECT, INSERT ON agent_billing TO agent_role.
                GRANT SELECT ON active_context_view TO agent_role.
                GRANT SELECT, INSERT ON agent_messages TO agent_role.
                REVOKE UPDATE, DELETE ON memory_events FROM agent_role.
                REVOKE SELECT ON vault.secrets FROM agent_role.
                REVOKE SELECT ON vault.decrypted_secrets FROM agent_role.
              inputs: {}
              expected_outputs:
                - migrations/001_initial_schema.sql (agent_role GRANT/REVOKE block)
              verification:
                - type: spec_agent
                  command: /axiom-verify
                  required: true
                  timeout_seconds: 300
            - id: step-2-2-2
              title: Write GRANT for compression_worker, tool_executor, alt_mode_role
              command: /axiom-step
              spec_ref: specs/011-canonical-definitions.md,specs/003-database.md
              description: |
                compression_worker: GRANT UPDATE (summary_text) ON memory_events. GRANT SELECT, INSERT, UPDATE ON display_modes, compression_queue.
                tool_executor: GRANT SELECT, INSERT ON tool_results. GRANT UPDATE ON tool_requests (status changes only).
                alt_mode_role: GRANT ALL ON ALL TABLES IN SCHEMA public. ALTER ROLE alt_mode_role BYPASSRLS.
              inputs: {}
              expected_outputs:
                - migrations/001_initial_schema.sql (compression_worker, tool_executor, alt_mode_role GRANT blocks)
              verification:
                - type: qa_agent
                  command: /axiom-verify
                  required: true
                  timeout_seconds: 300
        - id: task-2-3
          title: Cognitive firewall — external_quarantine
          spec_ref: specs/005-security.md,specs/003-database.md
          steps:
            - id: step-2-3-1
              title: CREATE TABLE external_quarantine with constraints
              command: /axiom-step
              spec_ref: specs/005-security.md,specs/003-database.md
              description: |
                CHECK source_type IN (scrape, api_response, file_upload, user_paste).
                CHECK validation_status IN (pending, validated, rejected, expired).
                FK promoted_memory_id → memory_events(id).
                expires_at DEFAULT now() + INTERVAL '1 hour'.
                Partial index WHERE validation_status = 'pending'.
                Document fast local model scanning flow for prompt injection detection.
              inputs: {}
              expected_outputs:
                - migrations/001_initial_schema.sql (external_quarantine block with documentation)
              verification:
                - type: spec_agent
                  command: /axiom-verify
                  required: true
                  timeout_seconds: 300
        - id: task-2-4
          title: Secret handling — audit table, vault isolation
          spec_ref: specs/005-security.md,specs/003-database.md
          steps:
            - id: step-2-4-1
              title: CREATE TABLE secret_access_audit + vault REVOKEs
              command: /axiom-step
              spec_ref: specs/005-security.md,specs/003-database.md
              description: |
                secret_access_audit (id UUID, session_id FK, secret_alias TEXT, accessed_at TIMESTAMPTZ).
                REVOKE SELECT ON vault.secrets FROM agent_role.
                REVOKE SELECT ON vault.decrypted_secrets FROM agent_role.
                Document {{SECRET.*}} alias pattern + harness scrubbing note.
                SECURITY DEFINER function pattern for reading secrets (SPEC-003 §7.6).
              inputs: {}
              expected_outputs:
                - migrations/001_initial_schema.sql (secret_access_audit + vault isolation blocks)
              verification:
                - type: qa_agent
                  command: /axiom-verify
                  required: true
                  timeout_seconds: 300

    - id: phase-3
      title: JSON Schema Validation & SQL Safety (SPEC-007, SPEC-011)
      spec_ref: specs/007-json-schema.md,specs/011-canonical-definitions.md,specs/003-database.md
      tasks:
        - id: task-3-1
          title: JSON Schema validation infrastructure for DB columns
          spec_ref: specs/007-json-schema.md,specs/003-database.md
          steps:
            - id: step-3-1-1
              title: Add pg_jsonschema extension and example CHECK constraint
              command: /axiom-step
              spec_ref: specs/003-database.md
              description: |
                CREATE EXTENSION IF NOT EXISTS pg_jsonschema.
                At least one example: ALTER TABLE order_tracking (or documented pattern) ADD CONSTRAINT CHECK (jsonb_matches_schema(...)).
                Document sqlite-jsonschema identical-syntax parity with known limitations ($ref, format).
              inputs: {}
              expected_outputs:
                - migrations/001_initial_schema.sql (pg_jsonschema + example constraint block)
              verification:
                - type: spec_agent
                  command: /axiom-verify
                  required: true
                  timeout_seconds: 300
        - id: task-3-2
          title: LLM output JSON schema contract and audit_logs
          spec_ref: specs/007-json-schema.md,specs/011-canonical-definitions.md
          steps:
            - id: step-3-2-1
              title: Document LLM output JSON schema contract
              command: /axiom-step
              spec_ref: specs/007-json-schema.md
              description: |
                Document in migration comments:
                Required: internal_monologue (string).
                Optional: memory_state_changes (string[]), system_actions (string[]), tool_requests, sub_agent_spawns, task_update.
                Structured Outputs guarantee reference (OpenAI response_format + Anthropic equivalent).
                AgentResponse TypeScript interface shape.
              inputs: {}
              expected_outputs:
                - migrations/001_initial_schema.sql (LLM output schema documentation block)
              verification:
                - type: qa_agent
                  command: /axiom-verify
                  required: true
                  timeout_seconds: 300
            - id: step-3-2-2
              title: Confirm audit_logs table references LLM output fields
              command: /axiom-step
              spec_ref: specs/007-json-schema.md,specs/011-canonical-definitions.md
              description: |
                Verify audit_logs table columns match: monologue TEXT, sql_executed TEXT[], result CHECK (committed, rolled_back).
                Document that iteration_commits.llm_response stores the full JSON, audit_logs is the structured access path.
              inputs: {}
              expected_outputs:
                - migrations/001_initial_schema.sql (audit_logs cross-ref to iteration_commits)
              verification:
                - type: spec_agent
                  command: /axiom-verify
                  required: true
                  timeout_seconds: 300
        - id: task-3-3
          title: SQL statement classification safety policy
          spec_ref: specs/011-canonical-definitions.md,specs/007-json-schema.md
          steps:
            - id: step-3-3-1
              title: Document SQL classifier, multi-statement split, execution policy
              command: /axiom-step
              spec_ref: specs/011-canonical-definitions.md
              description: |
                Document in migration comments or companion safety.md:
                1. Multi-statement splitting on semicolons (SPEC-011 §8.2).
                2. Classifier: DML_READ | DML_WRITE | DML_DELETE | DDL_CREATE | DDL_ALTER | DANGEROUS (SPEC-011 §8.3).
                3. Execution policy table (SPEC-011 §8.3 Layer 2): DANGEROUS=blocked, DML_DELETE=stored-procs-only, DML_WRITE=whitelist-check.
                4. Core table whitelist enumerating all 17 core tables (SPEC-011 §8.3 Layer 3).
                5. Stored-procedure preference: set_display_mode(), complete_session(), create_agent_memory_table() (SPEC-011 §8.3 Layer 4).
              inputs: {}
              expected_outputs:
                - migrations/001_initial_schema.sql (SQL classifier documentation block)
              verification:
                - type: spec_agent
                  command: /axiom-verify
                  required: true
                  timeout_seconds: 300
        - id: task-3-4
          title: Dynamic entity generator with reserved-name blocklist
          spec_ref: specs/003-database.md,specs/011-canonical-definitions.md
          steps:
            - id: step-3-4-1
              title: Document create_agent_memory_table contract
              command: /axiom-step
              spec_ref: specs/003-database.md
              description: |
                Document SECURITY DEFINER function shape (postgres).
                Reserved-name blocklist: sessions, memory_events, display_modes, iteration_commits, memory_pages,
                tasks, tool_requests, tool_results, tools_registry, skills_registry, agent_billing, workflows,
                custom_agent_tools, tool_files, external_quarantine, compression_queue, model_registry,
                staging_buffer, audit_logs, system_settings, agent_messages, api_keys, api_rate_limits,
                external_events, webhook_registrations, routing_rules, agent_circuit_breakers, agent_budget_limits,
                secret_access_audit, approval_requests.
                Document SQLite/PocketBase Go hook equivalent (OnRecordBeforeCreateRequest).
              inputs: {}
              expected_outputs:
                - migrations/001_initial_schema.sql (dynamic entity generator documentation block)
              verification:
                - type: qa_agent
                  command: /axiom-verify
                  required: true
                  timeout_seconds: 300

    - id: phase-4
      title: Canonical Definitions Audit & SQLite/PocketBase Parity (SPEC-011, SPEC-003)
      spec_ref: specs/011-canonical-definitions.md,specs/003-database.md
      tasks:
        - id: task-4-1
          title: Audit all CHECK constraints for canonical SPEC-011 enum values
          spec_ref: specs/011-canonical-definitions.md
          steps:
            - id: step-4-1-1
              title: Verify all CHECK constraints use lowercase canonical states
              command: /axiom-verify
              spec_ref: specs/011-canonical-definitions.md
              description: |
                Cross-reference each CHECK constraint in the migration against SPEC-011 §1–§6.
                sessions.status, tasks.status, memory_events.type, tools_registry.status/hemisphere/handler_type,
                agent_billing.category, display_modes.mode, external_quarantine.validation_status/source_type,
                custom_agent_tools.status/language, tool_requests.status.
                Flag any uppercase or non-canonical values.
              inputs: {}
              expected_outputs:
                - .memory-bank/work-items/schema-memory-01/verification.md (enum audit pass/fail per column)
              verification:
                - type: spec_agent
                  command: /axiom-verify
                  required: true
                  timeout_seconds: 300
        - id: task-4-2
          title: Produce SQLite/PocketBase parity documentation
          spec_ref: specs/003-database.md,specs/011-canonical-definitions.md,specs/005-security.md
          steps:
            - id: step-4-2-1
              title: Write parity feature table and PocketBase-equivalent patterns
              command: /axiom-step
              spec_ref: specs/003-database.md,specs/011-canonical-definitions.md
              description: |
                Cover all 11+ feature rows from SPEC-003 §8.2:
                Vector search (pgvector → sqlite-vec), JSON Schema (pg_jsonschema → sqlite-jsonschema, identical CHECK syntax),
                RLS (native → PocketBase API Rules + Go hooks with auth context — request hooks, NOT model hooks),
                Background jobs (pg_cron → Go goroutines + ticker via PocketBase OnServe hook),
                Async HTTP (pg_net → Go net/http), JavaScript runtime (PL/v8 → PocketBase JSVM),
                Append-only enforcement (REVOKE UPDATE/DELETE → Go OnRecordBeforeUpdateRequest/OnRecordBeforeDeleteRequest intercept),
                Triggers (native SQL → Go hooks on lifecycle events), WAL mode (PRAGMA journal_mode=WAL, checkpoint tuning),
                Secrets (Supabase Vault → env vars + encrypted .env), Dynamic table creation (SECURITY DEFINER → Go OnRecordBeforeCreateRequest hook).
                Include: 4-role model mapping to PocketBase (SPEC-005 §PocketBase table).
                Include: Exponential backoff + jitter for SQLite write contention (SPEC-003 §8.7).
                Include: SET LOCAL safety with Supavisor/PgBouncer transaction pooling, ORM configuration (Drizzle prepare:false on port 6543) (SPEC-011 §9.5).
                Include: PocketBase request hooks (with auth) vs model hooks (no auth) distinction — request hooks for security, model hooks for data integrity only.
              inputs: {}
              expected_outputs:
                - .memory-bank/work-items/schema-memory-01/parity.md
              verification:
                - type: qa_agent
                  command: /axiom-verify
                  required: true
                  timeout_seconds: 300

    - id: phase-5
      title: Verification & Evidence Collection
      tasks:
        - id: task-5-1
          title: Apply migration and capture evidence
          steps:
            - id: step-5-1-1
              title: Apply migration against Postgres or SQLite
              command: /axiom-step
              description: |
                psql -h localhost -U postgres -d conscience_test -f migrations/001_initial_schema.sql
                OR sqlite3 :memory: < migrations/001_initial_schema.sql
                Capture stdout/stderr. Verify exit code 0.
                Query information_schema.tables to confirm all expected tables exist.
              inputs: {}
              expected_outputs:
                - .memory-bank/work-items/schema-memory-01/migration-apply-output.txt
              verification:
                - type: manual
                  command: /axiom-verify
                  required: true
                  timeout_seconds: 600
            - id: step-5-1-2
              title: Populate verification.md with full AC coverage
              command: /axiom-step
              description: |
                Mark each of the 16 ACs (AC-MEM-001 through AC-MEM-016) as PASS/FAIL with evidence citation.
                Record checks executed, verifier results, injected work.
              inputs: {}
              expected_outputs:
                - .memory-bank/work-items/schema-memory-01/verification.md (fully populated)
              verification:
                - type: spec_agent
                  command: /axiom-verify
                  required: true
                  timeout_seconds: 300
            - id: step-5-1-3
              title: Run spec-verifier agent for contract alignment
              command: /axiom-verify
              description: |
                Invoke @spec-verifier-axiom to confirm migration aligns with all 5 cited specs:
                specs/002-memory.md, specs/003-database.md, specs/005-security.md,
                specs/007-json-schema.md, specs/011-canonical-definitions.md
              inputs: {}
              expected_outputs:
                - spec-verifier report (linked in verification.md)
              verification:
                - type: spec_agent
                  command: /axiom-verify
                  required: true
                  timeout_seconds: 600

