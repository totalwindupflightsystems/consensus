version: 1
work_item:
  id: deployment-ops-01
  jira_key: null
  repo: wojons/conscientiousness
  pr_branch: axiom/deployment-ops-01
meta_planning:
  notes_md_path: .memory-bank/work-items/deployment-ops-01/meta-planning.md
plan:
  phases:
    - id: phase-1
      title: Deployment — local operability and smoke
      tasks:
        - id: task-1-1
          title: Embedded migrations and binary build
          steps:
            - id: step-1-1-1
              title: Embed migration SQL and wire auto-migrate on startup
              spec_ref: specs/009-deployment.md
              description: >
                Implement //go:embed migrations/*.sql, AutoMigrate() function that reads
                schema_versions table, applies pending migrations in order, and records each.
                Includes drift detection that pauses all agents during migration.
              verification:
                - type: command
                  command: go build -o conscience ./cmd/conscience && ./conscience migrate status
                  required: true
                  timeout_seconds: 120
                - type: command
                  command: go test ./internal/migrate/... -v
                  required: true
                  timeout_seconds: 120
              rollback: revert migration files; delete from schema_versions table
              on_fail: escalate — embedded migrations are prerequisite for all other steps
            - id: step-1-1-2
              title: Configuration parity — single config surface for both backends
              spec_ref: specs/009-deployment.md#configuration
              description: >
                conscience.yaml with db, listen, heartbeat_interval, llm, harness sections.
                Supports flags and env var overrides. Identical behavior for Postgres and SQLite.
              verification:
                - type: command
                  command: ./conscience serve --help | grep -E "db|config" && go test ./internal/config/... -v
                  required: true
                  timeout_seconds: 120
              rollback: revert config.go and conscience.yaml template
              on_fail: fix config parsing; retry
            - id: step-1-1-3
              title: CLI management commands
              spec_ref: specs/009-deployment.md#the-binary
              description: >
                Implement conscience init, conscience migrate status/up/down, conscience session,
                conscience approve, conscience config commands.
              verification:
                - type: command
                  command: ./conscience --help && ./conscience migrate --help && go test ./cmd/... -v
                  required: true
                  timeout_seconds: 120
              rollback: revert cmd/ additions
              on_fail: fix command wiring; retry

        - id: task-1-2
          title: Deployment topology scripts and documentation
          steps:
            - id: step-1-2-1
              title: Document all six deployment topologies
              spec_ref: specs/009-deployment.md#deployment-topologies
              description: >
                Create deploy/ directory with scripts and READMEs for: local SQLite,
                local Postgres (Docker), Supabase Cloud, self-hosted Supabase,
                production Postgres+VM (fly.io/Railway/K8s example), and horizontal scaling.
              verification:
                - type: manual
                  command: "Review deploy/README.md covers all topologies; run deploy/local-sqlite.sh"
                  required: true
              evidence: deploy/README.md, deploy/*.sh
              rollback: rm -r deploy/
              on_fail: fix missing topology docs; retry

            - id: step-1-2-2
              title: Horizontal scaling smoke test
              spec_ref: specs/009-deployment.md#horizontal-scaling
              description: >
                Spin up 3 binary instances against shared Postgres; verify
                FOR UPDATE SKIP LOCKED ensures exclusive task claiming.
              verification:
                - type: command
                  command: go test ./internal/harness/... -run TestHorizontalScaling -v -count=1
                  required: true
                  timeout_seconds: 300
              rollback: revert harness scaling test file
              on_fail: fix task-claiming SQL; retry

    - id: phase-2
      title: Webhooks and external event ingestion
      tasks:
        - id: task-2-1
          title: Webhook endpoint and signature verification
          steps:
            - id: step-2-1-1
              title: Implement webhook handler with HMAC verification
              spec_ref: specs/013-webhooks-and-events.md#webhook-handler
              description: >
                HTTP handler at /webhooks/{source} reads webhook_registrations,
                verifies HMAC-SHA256 signature using registration.Secret, sets signature_valid.
              verification:
                - type: command
                  command: go test ./internal/webhooks/... -run TestHMACVerification -v
                  required: true
                  timeout_seconds: 120
              rollback: revert webhook handler and test files
              on_fail: fix HMAC verification; retry

            - id: step-2-1-2
              title: Enforce idempotency, rate limits, and payload limits
              spec_ref: specs/013-webhooks-and-events.md#security-considerations
              description: >
                ON CONFLICT DO NOTHING for duplicate source+source_id.
                Rate limit 60 req/min per IP with 429 response.
                Reject payloads > 1 MB with 413.
              verification:
                - type: command
                  command: go test ./internal/webhooks/... -run "TestIdempotency|TestRateLimit|TestPayloadLimit" -v
                  required: true
                  timeout_seconds: 180
              rollback: revert handler middleware additions
              on_fail: fix middleware; retry

        - id: task-2-2
          title: Event routing, quarantine, and lifecycle
          steps:
            - id: step-2-2-1
              title: Implement routing_rules matching and trigger-based dispatch
              spec_ref: specs/013-webhooks-and-events.md#event-routing
              description: >
                route_external_event() trigger (Postgres) or Go hook (SQLite)
                matches routing_rules by source_pattern, event_type_pattern,
                payload_pattern in priority order. Auto-wakes target session.
              verification:
                - type: command
                  command: go test ./internal/events/... -run TestRoutingRules -v
                  required: true
                  timeout_seconds: 120
              rollback: revert routing_rule.go and trigger migration
              on_fail: fix pattern matching; retry

            - id: step-2-2-2
              title: Implement quarantine for suspicious events
              spec_ref: specs/013-webhooks-and-events.md#quarantine
              description: >
                Events with signature_valid=false or matching attack patterns
                written to external_quarantine. Require Alt-Mode approval.
              verification:
                - type: command
                  command: go test ./internal/events/... -run TestQuarantineFlow -v
                  required: true
                  timeout_seconds: 120
              rollback: revert quarantine handler
              on_fail: fix quarantine insertion; retry

            - id: step-2-2-3
              title: Complete event status lifecycle
              spec_ref: specs/013-webhooks-and-events.md#schema
              description: >
                Ensure external_events.status transitions correctly:
                pending → routed → processing → completed|failed|quarantined.
                Add integration test covering full lifecycle.
              verification:
                - type: command
                  command: go test ./internal/events/... -run TestEventLifecycle -v
                  required: true
                  timeout_seconds: 120
              rollback: revert event service changes
              on_fail: fix status transitions; retry

        - id: task-2-3
          title: webhook_registrations CRUD and admin surface
          steps:
            - id: step-2-3-1
              title: Implement webhook_registrations management
              spec_ref: specs/013-webhooks-and-events.md#webhook_registrations
              description: >
                CRUD operations for webhook_registrations: create with name/source/url_path/
                secret/event_types/targets, update, enable/disable, delete.
                Include REST endpoints and CLI commands.
              verification:
                - type: command
                  command: go test ./internal/webhooks/... -run TestWebhookRegistrationsCRUD -v
                  required: true
                  timeout_seconds: 120
              rollback: revert CRUD handler
              on_fail: fix CRUD operations; retry

    - id: phase-3
      title: Human-in-the-Loop interrupt state
      tasks:
        - id: task-3-1
          title: approval_requests creation and flow
          steps:
            - id: step-3-1-1
              title: Implement request_approval() stored procedure
              spec_ref: specs/014-hitl-interrupt-state.md#request_approval
              description: >
                request_approval(type, description, risk_level, target_tool, target_sql, context)
                creates approval_requests row, pauses session, sets expires_at from hitl_configuration.
              verification:
                - type: command
                  command: go test ./internal/hitl/... -run TestRequestApproval -v
                  required: true
                  timeout_seconds: 120
              rollback: revert stored procedure migration
              on_fail: fix stored procedure; retry

            - id: step-3-1-2
              title: Implement review_approval() with decide/resume
              spec_ref: specs/014-hitl-interrupt-state.md#review_approval
              description: >
                review_approval(request_id, decision, reviewer_id, notes, modified_sql)
                validates decision (approved|rejected|modified), updates approval_requests,
                wakes session from paused to idle.
              verification:
                - type: command
                  command: go test ./internal/hitl/... -run TestReviewApproval -v
                  required: true
                  timeout_seconds: 120
              rollback: revert review_approval migration
              on_fail: fix review logic; retry

            - id: step-3-1-3
              title: Verify no-auto-approval rule
              spec_ref: specs/014-hitl-interrupt-state.md#no-auto-approval
              description: >
                Unit test confirms expired pending requests become 'expired' — never 'approved'.
                Sessions paused on expired approvals transition to 'failed'.
              verification:
                - type: command
                  command: go test ./internal/hitl/... -run TestNoAutoApproval -v
                  required: true
                  timeout_seconds: 120
              rollback: N/A (test only)
              on_fail: fix expiry handler; retry

        - id: task-3-2
          title: hitl_configuration and notification channels
          steps:
            - id: step-3-2-1
              title: Implement hitl_configuration with scope precedence
              spec_ref: specs/014-hitl-interrupt-state.md#hitl_configuration
              description: >
                hitl_configuration table with global/session scope; session overrides global.
                Fields: auto_pause_on_error_threshold, require_approval_for_destructive,
                require_approval_for_schema_changes, require_approval_for_external_tools,
                approval_timeout_minutes, notify_on_pause.
              verification:
                - type: command
                  command: go test ./internal/hitl/... -run TestHITLConfiguration -v
                  required: true
                  timeout_seconds: 120
              rollback: revert hitl_config migration and handler
              on_fail: fix scope precedence; retry

            - id: step-3-2-2
              title: Reviewer auth — enforce alt_mode_role
              spec_ref: specs/014-hitl-interrupt-state.md#reviewer-authorization
              description: >
                review_approval() checks current_setting('conscience.user_id').
                Only users with alt_mode_role can approve. Unit test for unauthorized rejection.
              verification:
                - type: command
                  command: go test ./internal/hitl/... -run TestReviewerAuthorization -v
                  required: true
                  timeout_seconds: 120
              rollback: revert auth check in review_approval
              on_fail: fix RBAC enforcement; retry

            - id: step-3-2-3
              title: Implement notification channels on pause
              spec_ref: specs/014-hitl-interrupt-state.md#notification-channels
              description: >
                On approval_request creation, fire notifications to: dashboard SSE,
                email (net/smtp or Mailgun), Slack webhook, generic webhook.
                Log each delivery in notification_log.
              verification:
                - type: command
                  command: go test ./internal/hitl/... -run TestNotificationChannels -v
                  required: true
                  timeout_seconds: 120
              rollback: revert notification handler
              on_fail: fix notification delivery; retry

    - id: phase-4
      title: Subagent orchestration boundaries
      tasks:
        - id: task-4-1
          title: Memory forking and RLS isolation
          steps:
            - id: step-4-1-1
              title: Implement memory forking via compressed pointer clone
              spec_ref: specs/004-subagents.md#memory-forking
              description: >
                Atomic INSERT … SELECT from memory_events WHERE display_modes.mode='compressed'
                and session_id=parent. Child gets references, not raw data.
                Post-fork isolation confirmed: parent writes don't propagate.
              verification:
                - type: command
                  command: go test ./internal/subagents/... -run TestMemoryForking -v
                  required: true
                  timeout_seconds: 120
              rollback: revert fork logic
              on_fail: fix SELECT clause; retry

            - id: step-4-1-2
              title: Enforce RLS isolation policies
              spec_ref: specs/004-subagents.md#row-level-security-isolation
              description: >
                CREATE POLICY isolate_memories/tasks/tools USING session_id =
                current_setting('conscience.session_id')::UUID.
                Unit tests confirm sub-agents cannot read/write other agents' data.
              verification:
                - type: command
                  command: go test ./internal/subagents/... -run TestRLSIsolation -v
                  required: true
                  timeout_seconds: 120
              rollback: DROP POLICY statements
              on_fail: fix RLS policy syntax; retry

        - id: task-4-2
          title: Wake, error propagation, and depth limit
          steps:
            - id: step-4-2-1
              title: Implement wake_parent_on_completion trigger
              spec_ref: specs/004-subagents.md#event-driven-wakeups
              description: >
                Trigger on sessions UPDATE: when NEW.status='completed' AND NEW.parent_id IS NOT NULL,
                set parent status='idle' WHERE parent was 'waiting_sub'.
                For SQLite, implement as Go hook with equivalent logic.
              verification:
                - type: command
                  command: go test ./internal/subagents/... -run TestParentWakeUp -v
                  required: true
                  timeout_seconds: 120
              rollback: DROP TRIGGER / remove Go hook
              on_fail: fix trigger condition; retry

            - id: step-4-2-2
              title: Implement error propagation from failed sub-agents
              spec_ref: specs/004-subagents.md#error-propagation
              description: >
                Failed child sets task status='failed'; wake_parent_on_completion fires
                regardless. Parent reads task.result for error context; decides retry/replace/escalate.
              verification:
                - type: command
                  command: go test ./internal/subagents/... -run TestErrorPropagation -v
                  required: true
                  timeout_seconds: 120
              rollback: revert error handling in wake trigger
              on_fail: fix result column population; retry

            - id: step-4-2-3
              title: Enforce depth-limit of 5 for sub-agent nesting
              spec_ref: specs/004-subagents.md#sub-agent-depth-limit
              description: >
                spawn_subagent() checks the current chain depth against system_settings
                (default 5). Rejects spawns exceeding limit. Test with deep nesting scenarios.
              verification:
                - type: command
                  command: go test ./internal/subagents/... -run TestDepthLimit -v
                  required: true
                  timeout_seconds: 120
              rollback: revert depth check in spawn_subagent
              on_fail: fix depth counting; retry

execution:
  status: complete
  cursor:
    phase_id: phase-4
    task_id: task-4-2
    step_id: step-4-2-3
  completed_at: 2026-06-01
  summary: >
    All 4 phases implemented and verified. 27 packages compile, all tests pass.
    25 acceptance criteria across 4 specs are met (AC-DEP-04 pending Postgres).
    Webhook handler with HMAC verification wired into router, HITL manager
    running in main server, subagent orchestration fully tested.
