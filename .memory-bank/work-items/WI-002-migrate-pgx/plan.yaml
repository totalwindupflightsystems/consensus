# yaml-language-server: $schema=../../../.opencode/skills/axiom-plan-schema/plan-schema.json
work_item_id: WI-002-migrate-pgx
title: "Migrate lib/pq → pgx/v5"
status: completed
specs:
  - specs/009-deployment.md
  - specs/015-api-and-mcp.md
  - specs/022-library-research.md

execution:
  cursor: phase-4/task-3  # Completed — ready for commit
  mode: sequential
  max_retries: 2

phases:
  - id: phase-1
    title: "Dependency + Connection Pool Migration"
    tasks:
      - id: task-1
        title: "Add pgx/v5 dependencies, remove lib/pq"
        actions:
          - "Search go.mod, go.sum for lib/pq version"
          - "Run: go get github.com/jackc/pgx/v5 github.com/jackc/pgx/v5/pgxpool"
          - "Remove github.com/lib/pq via go mod edit -droprequire"
          - "Verify go.sum is consistent: go mod tidy"
        verification:
          - "grep pgx go.mod → present"
          - "grep lib/pq go.mod → absent"
          - "go mod tidy succeeds"
        evidence: go.mod

      - id: task-2
        title: "Rewrite postgres.go with pgxpool"
        actions:
          - "Replace database/sql + lib/pq import with pgx/v5/pgxpool"
          - "DB struct: conn *sql.DB → pool *pgxpool.Pool"
          - "Open(): use pgxpool.New() instead of sql.Open()"
          - "Tx struct: tx *sql.Tx → tx pgx.Tx"
          - "BeginTx(): use pool.Begin() instead of conn.BeginTx()"
          - "Exec/Query/QueryRow: use pool.Exec/Query/QueryRow"
          - "Update scanRows/scanRow for pgx row access pattern"
          - "Remove database/sql usage entirely"
        verification:
          - "go build ./... passes"
          - "go vet ./internal/db/postgres/..."
        evidence: internal/db/postgres/postgres.go

  - id: phase-2
    title: "FOR UPDATE SKIP LOCKED"
    tasks:
      - id: task-1
        title: "Implement FOR UPDATE SKIP LOCKED in ClaimNextReadyTask"
        actions:
          - "In executor.go, detect backend type"
          - "For Postgres: UPDATE ... WHERE id = (SELECT id ... FOR UPDATE SKIP LOCKED LIMIT 1) RETURNING"
          - "For SQLite: keep existing behavior"
        verification:
          - "go build ./... passes"
          - "go test ./... passes"
        evidence: internal/harness/executor.go

  - id: phase-3
    title: "Postgres LISTEN/NOTIFY → EventBus"
    tasks:
      - id: task-1
        title: "Create notification listener for Postgres"
        actions:
          - "Create internal/db/postgres/notify.go"
          - "Start a goroutine that LISTENs on 'session_updates' and 'events' channels"
          - "Forward notifications to the EventBus"
          - "Wire start in Open() and close in Close()"
        verification:
          - "go build ./... passes"
        evidence: internal/db/postgres/notify.go

  - id: phase-4
    title: "Verify & Commit"
    tasks:
      - id: task-1
        title: "Full build, test, and commit"
        verification:
          - "go build ./... passes"
          - "go test ./... passes"
          - "go vet ./... passes"
        evidence: verification.md
      - id: task-2
        title: "Update SPEC-022 library research"
        actions:
          - "Update specs/022-library-research.md to reference pgx/v5"
        verification:
          - "grep pgx specs/022-library-research.md → present"
        evidence: specs/022-library-research.md
      - id: task-3
        title: "Commit changes"
        actions:
          - "git add -A"
          - "git commit with conventional commit + co-author trailer"
        verification:
          - "git log --oneline -1 shows proper message"
        evidence: "git log"

axiom:trace work_item=WI-002-migrate-pgx spec=specs/009-deployment.md,specs/015-api-and-mcp.md,specs/022-library-research.md plan=plan.yaml
