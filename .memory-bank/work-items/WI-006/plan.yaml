# yaml-language-server: $schema=../../../.opencode/skills/axiom-plan-schema/plan-schema.json
work_item_id: WI-006
title: "Three-Tier SQL Execution Model"
status: completed
specs:
  - specs/003-database.md
  - specs/005-security.md
  - specs/008-harness.md

execution:
  cursor: complete
  mode: sequential
  max_retries: 2

phases:
  - id: phase-1
    title: "Core Security Layer — Tier 1 + Tier 2 Executors"
    tasks:
      - id: task-1
        title: "Create internal/security/executor.go with tier types and execution functions"
        actions:
          - "Define ExecutionTier type (Tier1, Tier2, Tier3) and TrustLevel (Low, Medium, High)"
          - "Implement executeTier1(): only SELECT fn_name(...), validate against allowed function whitelist"
          - "Implement executeTier2(): parameterized SQL validation, type-safe param binding"
          - "Update EnforceExecutionPolicy() to accept trust level and route accordingly"
        verification:
          - "go build ./... passes"
          - "go vet ./internal/security/... passes"
        evidence: internal/security/executor.go

      - id: task-2
        title: "Create internal/security/executor_test.go with unit tests"
        actions:
          - "Test Tier 1: valid SELECT fn() passes, raw INSERT/UPDATE blocked"
          - "Test Tier 2: valid parameterized SQL passes, malformed params blocked"
          - "Test Tier 3: raw SQL with whitelist works (existing behavior preserved)"
          - "Test trust level routing: low→Tier1, medium→Tier2, high→Tier3"
        verification:
          - "go test ./internal/security/... passes"
        evidence: internal/security/executor_test.go

  - id: phase-2
    title: "Trigger Enforcement — Go-Level Constraints"
    tasks:
      - id: task-1
        title: "Create internal/security/triggers.go with Go-level trigger enforcement"
        actions:
          - "Implement enforceTaskTransitions(): valid status transitions"
          - "Implement enforcePrerequisites(): task dependency chain"
          - "Implement enforceToolRateLimit(): per-tool rate limiting"
          - "Create TaskValidator and ToolValidator types wrapping DB interface"
        verification:
          - "go build ./... passes"
        evidence: internal/security/triggers.go

      - id: task-2
        title: "Create internal/security/triggers_test.go with trigger tests"
        actions:
          - "Test enforceTaskTransitions: valid and invalid transitions"
          - "Test enforcePrerequisites: task with unmet prerequisites blocked"
          - "Test enforceToolRateLimit: rate limit exceeded blocked"
        verification:
          - "go test ./internal/security/... passes"
        evidence: internal/security/triggers_test.go

  - id: phase-3
    title: "Session Config — Agent Trust Level"
    tasks:
      - id: task-1
        title: "Add agent_trust_level to session config and types"
        actions:
          - "Add TrustLevel field to session.Session struct"
          - "Add TrustLevel constants: TrustLow, TrustMedium, TrustHigh"
          - "Update harness context reading to pass trust level"
          - "Update test harness to set trust level on test sessions"
        verification:
          - "go build ./... passes"
        evidence: internal/session/session.go

  - id: phase-4
    title: "Harness Wiring — Route Execution Through Tiers"
    tasks:
      - id: task-1
        title: "Wire EnforceExecutionPolicy in executor.go with tier routing"
        actions:
          - "Update executeStatement() to read trust level from session context"
          - "Route to executeTier1/2/3 based on trust level"
          - "Pass AllowedFunctions whitelist and tier info through context"
        verification:
          - "go build ./... passes"
        evidence: internal/harness/executor.go

      - id: task-2
        title: "Verify all existing tests still pass"
        actions:
          - "Run go test ./... to confirm no regressions"
          - "Fix any test failures from new session trust level requirement"
        verification:
          - "go test ./... passes"
        evidence: verification.md

  - id: phase-5
    title: "Prerequisite Enforcement Integration Test"
    tasks:
      - id: task-1
        title: "Create integration test for task prerequisite enforcement"
        actions:
          - "Create task with prerequisite_ids referencing another task"
          - "Attempt to claim the dependent task before prerequisite is published"
          - "Verify the claim is blocked with appropriate error"
        verification:
          - "go test -run TestPrerequisiteEnforcement ./internal/security/... passes"
        evidence: internal/security/triggers_test.go

  - id: phase-6
    title: "Commit"
    tasks:
      - id: task-1
        title: "Commit all changes"
        actions:
          - "git pull --rebase"
          - "git add -A"
          - "git commit with conventional commit + co-author trailer"
        verification:
          - "git log --oneline -1 shows proper message"
        evidence: "git log"

axiom:trace work_item=WI-006 spec=specs/003-database.md,specs/005-security.md,specs/008-harness.md plan=plan.yaml
