# yaml-language-server: $schema=../../../.opencode/skills/axiom-plan-schema/plan-schema.json
work_item_id: WI-001-remove-mock-llm
title: "Remove Mock LLM Fallback + Wire Real Clients"
status: completed
specs:
  - specs/007-json-schema.md
  - specs/012-prompt-engineering.md
  - specs/022-library-research.md

execution:
  cursor: phase-2/task-1  # Current position
  mode: sequential
  max_retries: 2

phases:
  - id: phase-1
    title: "Fail Fast + Mock Opt-In"
    tasks:
      - id: task-1
        title: "Remove mock fallback in main.go"
        spec_ref: specs/022-library-research.md
        actions:
          - "Change main.go:112-114 from Warn+fallback to fatal error"
          - "If provider=mock and CONSCIENCE_MOCK_LLM not set, return error"
        verification:
          - "grep for NewMockClient in main.go — must not be called as fallback"
          - "go build ./... passes"
        evidence: cmd/conscience/main.go
        rollback: "git checkout -- cmd/conscience/main.go"

      - id: task-2
        title: "Add CONSCIENCE_MOCK_LLM env var in NewClient factory"
        spec_ref: specs/022-library-research.md
        actions:
          - "In NewClient(), check os.Getenv('CONSCIENCE_MOCK_LLM')"
          - "Only allow ProviderMock when env var is '1' (or config explicitly says mock)"
          - "If provider=mock and env not set, return error"
        verification:
          - "Unit test: CONSCIENCE_MOCK_LLM=1 → NewClient returns MockClient"
          - "Unit test: no env var + ProviderMock → error"
          - "go test ./internal/llm/..."
        evidence: internal/llm/client.go

  - id: phase-2
    title: "Anthropic HTTP Client"
    tasks:
      - id: task-1
        title: "Create anthropic_client.go with real HTTP implementation"
        spec_ref: specs/022-library-research.md
        actions:
          - "Create internal/llm/anthropic_client.go"
          - "Implement anthropicClient struct with http.Client, baseURL, apiKey"
          - "Implement Messages API: POST /v1/messages"
          - "Map harness.Message roles to Anthropic roles"
          - "Parse response into harness.AgentOutput"
          - "Add cache_control breakpoints on system messages"
        verification:
          - "go build ./... passes"
          - "Compile-time check: var _ harness.LLMClient = (*anthropicClient)(nil)"
        evidence: internal/llm/anthropic_client.go

      - id: task-2
        title: "Wire Anthropic in config defaults + factory"
        spec_ref: specs/022-library-research.md
        actions:
          - "Verify NewClient dispatches ProviderAnthropic to NewAnthropicClient"
          - "Remove stubClient type from client.go"
        verification:
          - "go test ./internal/llm/..."
        evidence: internal/llm/client.go

  - id: phase-3
    title: "OpenAI Structured Outputs"
    tasks:
      - id: task-1
        title: "Add ResponseFormat config and wire json_schema"
        spec_ref: specs/007-json-schema.md
        actions:
          - "Add ResponseFormat field to llm.Config (json_object|json_schema)"
          - "Add JSON schema definition for AgentOutput"
          - "In openaiClient.Call(), use json_schema with strict:true when configured"
          - "Default to json_object for backward compatibility"
        verification:
          - "go build ./... passes"
          - "Inspect generated request body has json_schema with strict:true"
        evidence: internal/llm/openai_client.go

  - id: phase-4
    title: "Verify & Commit"
    tasks:
      - id: task-1
        title: "Full build and test"
        verification:
          - "go build ./... passes"
          - "go test ./... passes"
          - "go vet ./... passes"
        evidence: verification.md

      - id: task-2
        title: "Commit changes"
        actions:
          - "git add -A"
          - "git commit with conventional commit + co-author trailer"
        verification:
          - "git log --oneline -1 shows proper message"
        evidence: "git log"

axiom:trace work_item=WI-001-remove-mock-llm spec=specs/007-json-schema.md,specs/012-prompt-engineering.md,specs/022-library-research.md plan=plan.yaml
