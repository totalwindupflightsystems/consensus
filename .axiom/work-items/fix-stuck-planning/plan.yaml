work_item: fix-stuck-planning
title: "Fix session stuck in planning status after error"
priority: high
status: pending
files_to_modify:
  - internal/harness/planning.go
steps:
  - step: 1
    action: "Update handlePlanningError to reset session status"
    details: |
      When ReadActiveContext fails during planning (e.g., missing table),
      handlePlanningError rolls back the transaction but does NOT reset
      the session status from 'planning' back to 'failed' or 'thinking'.
      The session stays 'planning' forever with no goroutine processing it.
      Fix: add h.db.Exec to set status='failed' in handlePlanningError.
verification:
  - "Session transitions from planning to failed on error"
  - "Heartbeat can re-pick up failed sessions"
