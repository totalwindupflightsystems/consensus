# Skill Map Decision Tree — structured routing from problem to skills
# Spec: specs/85-Skill-Map-Decision-Tree.md
# axiom:trace work_item=skill-map-01 spec=specs/85-Skill-Map-Decision-Tree.md

version: 7
updated: "2026-05-18"

# -------------------------------------------------------------------
# Global skills — always recommended regardless of domain match
# -------------------------------------------------------------------
global:
  skills:
    - baby-steps-methodology
    - traceability-doctrine
    - evidence-bundle-schema
    - axiom-confidence-scoring
    - axiom-retry-escalation
    - axiom-mission-north-star
  conditional_required:
    - when: "harness.model.provider == 'openai' or harness.model.name contains 'gpt'"
      reason: "GPT/OpenAI-family models tend to overuse bullets, headings, and tables in human-facing answers unless explicitly steered toward paragraph-first writing."
      applies_to:
        - human-facing assistant responses
        - conversational status updates
        - user-visible summaries
        - plans or reports where the user did not request formal structure
      skills:
        - gpt-paragraph-first-writing-axiom

