  patterns:
    description: "Reusable multi-tool workflow patterns for common agent tasks. Each skill has been run live and includes real execution traces with on/off-track signals."
    signals:
      - "explore codebase"
      - "explore symbol"
      - "who calls"
      - "blast radius"
      - "handoff context"
      - "pass context"
      - "hand off"
      - "park context"
      - "monitor logs"
      - "watch file"
      - "watch for errors"
      - "reactive grep"
      - "investigate changes"
      - "what changed"
      - "what happened"
      - "change impact"
      - "pattern"
      - "workflow pattern"
    problem_types:
      explore-codebase:
        description: "Find where a symbol is defined, who calls it, and store structured findings in tree memory. Uses code-intel CLI + tree.commit + stash."
        skills:
          - pattern-explore-codebase
          - code-graph-intelligence-axiom
        agents:
          - "@dev-axiom"
          - "@spec-verifier-axiom"
      handoff-context:
        description: "Park working context in a stash and hand it off to the next agent or session. Uses stash_push + stash_ref + stash_peek."
        skills:
          - pattern-handoff-context
          - context-stash-axiom
        agents:
