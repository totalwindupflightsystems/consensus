        skills:
          - pattern-investigate-changes
          - code-graph-intelligence-axiom
        agents:
          - "@dev-axiom"
          - "@qa-axiom"
      coordinate-swarm:
        description: "Spawn N agents in parallel for independent tasks, collect results. Uses conductor_spawn + conductor_collect."
        skills:
          - pattern-coordinate-swarm
        agents:
          - "@dev-axiom"
