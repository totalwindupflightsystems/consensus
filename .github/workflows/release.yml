# Tag-triggered release (RELEASE-CONSENSUS-1): building a v* tag runs
# GoReleaser against the existing .goreleaser.yaml (build matrix, archives,
# checksums, changelog) and attaches the assets to a GitHub Release.
name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    name: GoReleaser Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Full history + tags: GoReleaser derives the changelog and needs
          # the tag itself reachable.
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.26"

      - name: Validate tag
        run: |
          case "${GITHUB_REF_NAME}" in
            v[0-9]*)
              echo "releasing ${GITHUB_REF_NAME}"
              ;;
            *)
              echo "refusing to release: GITHUB_REF_NAME=${GITHUB_REF_NAME} does not match ^v" >&2
              exit 1
              ;;
          esac

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: "~> v2"
          # .goreleaser.yaml owns the build matrix, archives, checksums and
          # changelog; --clean removes stale dist/ output first.
          args: release --clean
          install-only: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
