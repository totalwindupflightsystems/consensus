# Tag-triggered release (RELEASE-CONSENSUS-1): building a v* tag runs
# GoReleaser against the existing .goreleaser.yaml (build matrix, archives,
# checksums, changelog) and attaches the assets to a GitHub Release.
#
# Local simulation (`act -W .github/workflows/release.yml`):
#   act cannot publish — its push event arrives on the default branch (no v*
#   ref, so the tag guard below has nothing to validate) and its synthesised
#   token cannot write releases. Rather than failing on either, the two
#   publish-only pieces are environment-gated: the tag guard runs on a real
#   runner, and under act GoReleaser builds a SNAPSHOT of the same release
#   matrix (same config, same binaries/archives/checksums, no upload), so the
#   local run still exercises the real build instead of reporting green on a
#   skipped job. Publishing is only ever exercised by a real `v*` tag push.
name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    name: GoReleaser Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Full history + tags: GoReleaser derives the changelog and needs
          # the tag itself reachable.
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.26"

      - name: Validate tag
        # Gated to real runners: the tag is what a `v*` push provides, and a
        # local act push event is always the default branch, so there is no tag
        # to validate there (the guard itself is unchanged on GitHub).
        if: ${{ env.ACT != 'true' }}
        run: |
          case "${GITHUB_REF_NAME}" in
            v[0-9]*)
              echo "releasing ${GITHUB_REF_NAME}"
              ;;
            *)
              echo "refusing to release: GITHUB_REF_NAME=${GITHUB_REF_NAME} does not match ^v" >&2
              exit 1
              ;;
          esac

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: "~> v2"
          # .goreleaser.yaml owns the build matrix, archives, checksums and
          # changelog; --clean removes stale dist/ output first. Under a local
          # runner (act sets ACT=true) the same config is exercised as a
          # snapshot build with no publish step, because there is no tag to
          # release and no token that could upload.
          args: ${{ env.ACT == 'true' && 'release --clean --snapshot --skip=publish' || 'release --clean' }}
          install-only: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
