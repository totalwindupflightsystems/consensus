name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # ── Build + Short Tests (fast, no LLM) ──────────────────────────
  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"

      - name: Build
        run: make build

      - name: Test (short)
        run: make test-short

      - name: Vet
        run: go vet ./...

  # ── Postgres Integration Tests ──────────────────────────────────
  postgres:
    name: Postgres Integration
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: conscience
          POSTGRES_PASSWORD: conscience
          POSTGRES_DB: conscience
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 2s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"

      - name: Postgres full integration test
        env:
          CONSCIENCE_TEST_POSTGRES_URL: postgres://conscience:conscience@localhost:5432/conscience?sslmode=disable
        run: make test-pg-full

  # ── Real LLM E2E Tests (manual / scheduled only — costs tokens) ─
  e2e-llm:
    name: E2E (Real LLM)
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"

      - name: Run real-LLM E2E tests
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: |
          go test ./internal/harness \
            -run 'TestE2ERealLLMServe|TestE2E_CircuitBreaker|TestE2E_TransactionAtomicity|TestE2E_CrashRecovery|TestE2E_SemanticRetrieval' \
            -v -count=1 -timeout 300s

  # ── Docker Build ────────────────────────────────────────────────
  docker:
    name: Docker Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
