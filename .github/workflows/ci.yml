name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  # ── Build + Short Tests (fast, no LLM) ──────────────────────────
  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"

      - name: Build
        run: make build

      - name: Test (short)
        run: make test-short

      - name: Vet
        run: go vet ./...

  # ── Cross-Platform Build Matrix ─────────────────────────────────
  cross-build:
    name: Build (${{ matrix.os }}/${{ matrix.arch }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        os: [linux, darwin, windows]
        arch: [amd64, arm64]
        # windows/arm64 doesn't have a standard Go builder
        exclude:
          - os: windows
            arch: arm64
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"

      - name: Cross-compile
        env:
          GOOS: ${{ matrix.os }}
          GOARCH: ${{ matrix.arch }}
          CGO_ENABLED: 0
        run: |
          go build -o "consensus-${{ matrix.os }}-${{ matrix.arch }}" ./cmd/consensus
          file "consensus-${{ matrix.os }}-${{ matrix.arch }}"

  # ── Postgres Integration Tests ──────────────────────────────────
  postgres:
    name: Postgres Integration
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: consensus
          POSTGRES_PASSWORD: consensus
          POSTGRES_DB: consensus
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 2s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"

      - name: Postgres full integration test
        env:
          CONSENSUS_TEST_POSTGRES_URL: postgres://consensus:consensus@localhost:5432/consensus?sslmode=disable
        run: make test-pg-full

  # ── GoReleaser Config Check ─────────────────────────────────────
  goreleaser-check:
    name: GoReleaser Config
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: goreleaser/goreleaser-action@v6
        with:
          version: latest
          args: check

  # ── GitReins Tier 1 Guard (fast, no LLM — every push/PR) ─────
  gitreins-guard:
    name: GitReins Guard (Tier 1)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"

      - name: Install GitReins
        run: pip install gitreins

      - name: Secrets scan
        run: |
          bash .gitreins/pre-commit
        # Runs the same pre-commit hook CI-side — secrets (blocking), vet, test-short

  # ── GitReins Tier 2 Evaluator (LLM — manual/scheduled/PR) ─────
  gitreins-eval:
    name: GitReins Evaluator (Tier 2)
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule' || (github.event_name == 'pull_request' && github.event.action != 'closed')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"

      - name: Install GitReins
        run: pip install gitreins==0.3.0

      - name: Run evaluator (all tasks)
        env:
          GITREINS_LLM_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          GITREINS_LLM_BASE_URL: https://api.deepseek.com/v1
          GITREINS_LLM_MODEL: deepseek-v4-flash
        run: python3 .gitreins/eval-runner.py --all

  # ── Real LLM E2E Tests (manual / scheduled only — costs tokens) ─
  e2e-llm:
    name: E2E (Real LLM)
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"

      - name: Run real-LLM E2E tests
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: |
          go test ./internal/harness \
            -run 'TestE2ERealLLMServe|TestE2E_CircuitBreaker|TestE2E_TransactionAtomicity|TestE2E_CrashRecovery|TestE2E_SemanticRetrieval' \
            -v -count=1 -timeout 300s

  # ── Docker Build & Push ────────────────────────────────────────
  docker:
    name: Docker Build & Push
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=sha,prefix=
            type=ref,event=tag
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/master' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
