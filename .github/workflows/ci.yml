name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  # ── Build + Short Tests (fast, no LLM) ──────────────────────────
  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"

      - name: Build
        run: make build

      - name: Test (short)
        run: make test-short

      - name: Vet
        run: go vet ./...

  # ── Cross-Platform Build Matrix ─────────────────────────────────
  cross-build:
    name: Build (${{ matrix.os }}/${{ matrix.arch }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        os: [linux, darwin, windows]
        arch: [amd64, arm64]
        # windows/arm64 doesn't have a standard Go builder
        exclude:
          - os: windows
            arch: arm64
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"

      - name: Cross-compile
        env:
          GOOS: ${{ matrix.os }}
          GOARCH: ${{ matrix.arch }}
          CGO_ENABLED: 0
        run: |
          go build -o "consensus-${{ matrix.os }}-${{ matrix.arch }}" ./cmd/consensus
          file "consensus-${{ matrix.os }}-${{ matrix.arch }}"

  # ── Postgres Integration Tests ──────────────────────────────────
  postgres:
    name: Postgres Integration
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"

      - name: Pull and start PostgreSQL with retry
        shell: bash
        run: |
          image="pgvector/pgvector:pg16"
          for attempt in {1..5}; do
            if docker pull "$image"; then
              break
            fi
            if [ "$attempt" -eq 5 ]; then
              echo "Failed to pull $image after $attempt attempts" >&2
              exit 1
            fi
            delay=$((attempt * 10))
            echo "Pull attempt $attempt failed; retrying in ${delay}s" >&2
            sleep "$delay"
          done

          docker rm -f consensus-postgres >/dev/null 2>&1 || true

          db_args=(
            -e POSTGRES_USER=consensus
            -e POSTGRES_PASSWORD=consensus
            -e POSTGRES_DB=consensus
            --health-cmd="pg_isready -U consensus -d consensus"
            --health-interval=2s
            --health-timeout=5s
            --health-retries=10
          )

          # Hosted runners always take this branch: publish the database on the
          # host port the test URL names.
          if docker run -d --name consensus-postgres "${db_args[@]}" -p 5432:5432 "$image" >/dev/null; then
            echo "CONSENSUS_TEST_POSTGRES_URL=postgres://consensus:consensus@localhost:5432/consensus?sslmode=disable" >> "$GITHUB_ENV"
          else
            # The host port is taken — a machine-local PostgreSQL, which hosted
            # runners do not have and which is what breaks local `act` runs
            # ("failed to bind host port 0.0.0.0:5432/tcp: address already in
            # use"). Publish on an ephemeral loopback port instead: same
            # container, same test, no dependency on a host port being free.
            echo "host port 5432 is unavailable - publishing the database on an ephemeral loopback port" >&2
            docker rm -f consensus-postgres >/dev/null 2>&1 || true
            docker run -d --name consensus-postgres "${db_args[@]}" -p 127.0.0.1::5432 "$image" >/dev/null
            host_port=$(docker port consensus-postgres 5432/tcp | head -n1 | sed 's/.*://')
            [ -n "$host_port" ] || { echo "could not determine the published postgres port" >&2; exit 1; }
            echo "CONSENSUS_TEST_POSTGRES_URL=postgres://consensus:consensus@127.0.0.1:${host_port}/consensus?sslmode=disable" >> "$GITHUB_ENV"
          fi

          for attempt in {1..10}; do
            if docker exec consensus-postgres pg_isready -U consensus -d consensus; then
              exit 0
            fi
            sleep 2
          done
          docker logs consensus-postgres
          exit 1

      - name: Postgres full integration test
        # CONSENSUS_TEST_POSTGRES_URL is exported by the start step above (host
        # port when free, an ephemeral loopback port when not) and is consumed
        # through the Makefile's `$${CONSENSUS_TEST_POSTGRES_URL:-...}` default.
        run: make test-pg-full

  # ── GoReleaser Config Check ─────────────────────────────────────
  goreleaser-check:
    name: GoReleaser Config
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: goreleaser/goreleaser-action@v6
        with:
          version: latest
          args: check

  # ── GitReins Tier 1 Guard (fast, no LLM — every push/PR) ─────
  gitreins-guard:
    name: GitReins Guard (Tier 1)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"

      - name: Install GitReins
        # Best-effort by design. The Tier-1 guard below is the repo's own shell
        # script (.gitreins/pre-commit) and needs only Go, so the CLI is
        # installed for parity with local use and must never decide this job's
        # verdict. It goes into an isolated venv because the runner images we
        # run on differ: act's default image is a Debian node image with no
        # Python at all, and Ubuntu 24.04 (`ubuntu-latest` AND this repo's act
        # image) marks its system Python externally managed (PEP 668) — there
        # plain `pip install` refuses, and `--break-system-packages` still
        # cannot replace Debian-owned dependencies
        # (`ERROR: Cannot uninstall PyJWT 2.7.0, RECORD file not found`).
        # Falls back to the plain commands, and a skip is not a failure.
        continue-on-error: true
        run: |
          if command -v python3 >/dev/null 2>&1 && python3 -m venv "$RUNNER_TEMP/gitreins-venv" 2>/dev/null; then
            "$RUNNER_TEMP/gitreins-venv/bin/pip" install --quiet gitreins
            echo "$RUNNER_TEMP/gitreins-venv/bin" >> "$GITHUB_PATH"
            echo "gitreins CLI installed into $RUNNER_TEMP/gitreins-venv"
          elif command -v pip >/dev/null 2>&1; then
            pip install gitreins
          else
            echo "::notice::no Python/pip on this runner image — skipping the GitReins CLI install (the Tier-1 guard below is a shell script and needs only Go)"
          fi

      - name: Secrets scan
        run: |
          bash .gitreins/pre-commit
        # Runs the same pre-commit hook CI-side — secrets (blocking), vet, test-short

  # ── GitReins Tier 2 Evaluator (LLM — manual/scheduled/PR) ─────
  gitreins-eval:
    name: GitReins Evaluator (Tier 2)
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule' || (github.event_name == 'pull_request' && github.event.action != 'closed')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"

      - name: Install GitReins
        run: pip install gitreins==0.3.0

      - name: Run evaluator (all tasks)
        env:
          GITREINS_LLM_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          GITREINS_LLM_BASE_URL: https://api.deepseek.com/v1
          GITREINS_LLM_MODEL: deepseek-v4-flash
        run: python3 .gitreins/eval-runner.py --all

  # ── Real LLM E2E Tests (manual / scheduled only — costs tokens) ─
  e2e-llm:
    name: E2E (Real LLM)
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"

      - name: Run real-LLM E2E tests
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: |
          go test ./internal/harness \
            -run 'TestE2ERealLLMServe|TestE2E_CircuitBreaker|TestE2E_TransactionAtomicity|TestE2E_CrashRecovery|TestE2E_SemanticRetrieval' \
            -v -count=1 -timeout 300s

  # ── Docker Build & Push ────────────────────────────────────────
  docker:
    name: Docker Build & Push
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    # Auth is gated, not assumed. Two cases must not attempt a registry login:
    #   - act (the local simulator) sets ACT=true and synthesises a runtime
    #     token that GHCR rejects ("denied: permission_denied: The token
    #     provided does not match expected scopes") — and it does so AFTER a
    #     full image build, which is what made this job unreadable locally.
    #     Verified with a probe workflow: under act `env.ACT == 'true'` holds
    #     and secrets.GITHUB_TOKEN is NON-empty, so gating on token presence
    #     alone does not work — the gate must name ACT.
    #   - a hosted runner without a token must skip auth rather than fail.
    # Both are step-level checks: the `env` context (and runner env such as
    # ACT) is available in a step `if`, but NOT when declaring job-level env.
    env:
      GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        if: ${{ env.ACT != 'true' && env.GHCR_TOKEN != '' }}
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ env.GHCR_TOKEN }}

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=sha,prefix=
            type=ref,event=tag
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ env.ACT != 'true' && env.GHCR_TOKEN != '' && github.event_name == 'push' && github.ref == 'refs/heads/master' }}
          build-args: |
            GO_IMAGE=public.ecr.aws/docker/library/golang:1.26-alpine
            ALPINE_IMAGE=public.ecr.aws/docker/library/alpine:3.21
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
