# Consensus — Default configuration
# axiom:trace work_item=repo-bootstrap-01 spec=specs/016-cli-interface.md,specs/021-repository-layout.md plan=phase-1/task-1/step-2

server:
  hostname: 127.0.0.1
  port: 8094

llm:
  default_model: deepseek-v4-flash
  provider: openai
  base_url: https://api.deepseek.com/v1
  api_key: ${DEEPSEEK_API_KEY}
  max_context_tokens: 128000
  max_output_tokens: 16384
  # Alternative: LM Studio (local qwen models)
  # default_model: qwen/qwen3.6-35b-a3b
  # provider: openai
  # base_url: http://127.0.0.1:1234/v1
  # api_key: lm-studio

harness:
  heartbeat_interval_seconds: 5
  max_iterations: 100
  max_consecutive_errors: 3
  budget_limit_cents: 1000

database:
  url: sqlite://dev.db?_journal_mode=WAL
  max_open_conns: 5

hitl:
  auto_pause_on_error_threshold: 3
  require_approval_for_destructive: true
  require_approval_for_schema_changes: true
  approval_timeout_minutes: 60

logging:
  level: info
  format: text

compression:
  enabled: true
  poll_interval_seconds: 5
  batch_size: 5
  cosine_threshold: 0.85
  embedding_model: text-embedding-3-small

api_rate:
  admin_per_min: 1000
  session_per_min: 100
  readonly_per_min: 200
  webhook_per_min: 500
